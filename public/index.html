<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>トキノート</title>
<style>
:root{
  --bg:#eef1f5; --card:#fff; --ink:#1d2330; --sub:#5b6474; --line:#d9dee7;
  --accent:#1f6feb; --accent-soft:#e7f0ff; --ok:#e5002d; --tri:#f08c00; --ng:#2f6fe0;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}

/* ===== main ===== */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line);z-index:5}
.ib{min-width:42px;height:42px;border-radius:12px;font-size:20px;display:inline-flex;align-items:center;justify-content:center}
.ib:active,.pill:active{background:#e9edf3}
.ib.on{background:var(--accent-soft);outline:2px solid var(--accent)}
.pill{height:42px;padding:0 12px;border-radius:21px;background:#f1f3f7;font-size:15px;font-weight:600;white-space:nowrap}
.pill b{color:var(--ok)}
#bookTitle{font-weight:700;font-size:15px;max-width:22vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stats{font-size:13px;color:var(--sub);white-space:nowrap}
.sp{flex:1}
#cloud{font-size:12px;color:var(--sub);white-space:nowrap}
@media (max-width:900px){ #btnZoomOut,#btnZoomIn{display:none} }
#viewer{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
#pages{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 12px 140px;min-width:100%;width:max-content;box-sizing:border-box}
.page{position:relative;background:#fff;box-shadow:0 1px 4px rgba(20,30,50,.18);flex:none;touch-action:pan-x pan-y}
body.fd .page{touch-action:none}
.page canvas{position:absolute;left:0;top:0;display:block}
#mainArea{flex:1;display:flex;min-height:0;position:relative}
#memo{position:absolute;z-index:5;display:flex;flex-direction:column;background:#fcfdff;border:2px solid #b9c4d4;border-radius:14px;
  box-shadow:0 8px 28px rgba(20,30,50,.25);overflow:hidden}
.mhead{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 10px;background:#eef3fa;border-bottom:1px solid var(--line);font-size:14px;touch-action:none;cursor:move;flex:none}
.mhead .grip{color:#9aa5b5;font-size:16px;letter-spacing:-2px;margin-right:4px}
#memoResize{position:absolute;right:0;bottom:0;width:40px;height:40px;touch-action:none;cursor:nwse-resize;z-index:2;
  display:flex;align-items:flex-end;justify-content:flex-end;padding:3px 5px;color:#5b6f8f;font-size:16px;
  background:linear-gradient(135deg,transparent 52%,rgba(31,111,235,.18) 52%);border-bottom-right-radius:12px}
#memoBody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#memoStage{position:relative;touch-action:pan-x pan-y;
  background-image:linear-gradient(#e6ebf3 1px,transparent 1px),linear-gradient(90deg,#e6ebf3 1px,transparent 1px);background-size:28px 28px}
body.fd #memoStage{touch-action:none}
#memoStage canvas{position:absolute;left:0;top:0;display:block}
#btnMemo.on{background:var(--accent-soft);outline:2px solid var(--accent)}
.page canvas.live{pointer-events:none}
.ov{position:absolute;inset:0;pointer-events:none}
.ov>*{position:absolute;left:calc(var(--x) * var(--u) * 1px);top:calc(var(--y) * var(--u) * 1px);
  width:calc(var(--w) * var(--u) * 1px);height:calc(var(--h) * var(--u) * 1px)}
.pno{position:absolute;right:-2px;bottom:-22px;font-size:12px;color:var(--sub)}
.mask{background:#8f99a8;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;
  font-size:clamp(12px,calc(var(--h) * var(--u) * .5px),28px);transition:background .15s}
.mask::after{content:"？"}
.mask.open{background:transparent;outline:2px dashed rgba(143,153,168,.8)}
.mask.open::after{content:""}
.region{border:2px dashed rgba(31,111,235,.45);border-radius:8px}
.badge{position:absolute;left:-2px;top:-14px;background:#fff;border:1.5px solid rgba(31,111,235,.6);color:var(--accent);
  font-size:12px;font-weight:700;padding:1px 7px;border-radius:10px;white-space:nowrap}
.badge.ng{border-color:var(--ng);color:var(--ng)} .badge.ok{border-color:var(--ok);color:var(--ok)} .badge.grad{border-color:#b8860b;color:#b8860b}
.del{position:absolute;right:-12px;top:-12px;width:28px;height:28px;border-radius:50%;background:#e5002d;color:#fff;font-weight:800;
  font-size:16px;line-height:28px;text-align:center;pointer-events:auto;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.rubber{border:2px dashed var(--accent);background:rgba(31,111,235,.08);border-radius:6px}
.rubber.mask{border-color:#6b7380;background:rgba(107,115,128,.25)}
.loading{padding:60px 20px;color:var(--sub);font-size:16px}

/* tools */
#tools{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;background:var(--card);border-radius:20px;
  box-shadow:0 4px 18px rgba(20,30,50,.18);max-width:calc(100vw - 16px)}
#toolBtns{display:flex;gap:2px;flex-wrap:nowrap}
#toolsMini{display:none}
#tools.min{left:auto;right:calc(12px + env(safe-area-inset-right));transform:none;padding:5px;border-radius:18px}
#tools.min #toolBtns,#tools.min #row2{display:none}
#tools.min #toolsMini{display:flex;outline:2px solid var(--accent);background:var(--accent-soft)}
#row2{display:flex;align-items:center;gap:2px}
@media (min-width:1100px){ #tools{flex-direction:row} #row2{margin-left:6px;border-left:1px solid var(--line);padding-left:6px} }
.tool{width:clamp(34px,calc((100vw - 52px)/10),54px);height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;line-height:1}
.tool small{font-size:10px;white-space:nowrap;color:var(--sub);margin-top:3px}
.tool.on{background:var(--accent-soft);outline:2px solid var(--accent)}
.sep{width:1px;height:38px;background:var(--line);margin:0 4px}
#opts{display:flex;align-items:center;gap:6px;min-height:46px;padding:0 4px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
.sw.pal{background:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;border:0;box-shadow:0 0 0 1.5px var(--line)}
.wd{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.wd i{display:block;background:var(--ink);border-radius:9px;width:22px}
.wd.on{background:var(--accent-soft);outline:2px solid var(--accent)}
.hint{font-size:13px;color:var(--sub);max-width:200px;line-height:1.35}
.ib:disabled{opacity:.3}

/* red sheet */
#redsheet{position:fixed;left:0;right:0;height:38vh;background:#ff0000;mix-blend-mode:multiply;pointer-events:none;z-index:4}
#redgrip{position:fixed;left:50%;transform:translate(-50%,-100%);z-index:7;background:#c4001c;color:#fff;font-weight:700;font-size:14px;
  padding:8px 18px;border-radius:14px 14px 0 0;touch-action:none;cursor:grab}

/* screens */
.screen{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:6px 0 14px}
h2{font-size:18px;margin:22px 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{height:40px;padding:0 16px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-weight:700}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.big{display:block;width:100%;height:58px;border-radius:16px;background:var(--accent);color:#fff;font-size:18px;font-weight:800;margin:14px 0}
.big.sub{background:#fff;color:var(--accent);border:2px solid var(--accent)}
.card{background:#fff;border-radius:var(--r);padding:14px 16px;margin:10px 0;box-shadow:0 1px 3px rgba(20,30,50,.08);display:flex;gap:12px;align-items:center}
.card .t{font-weight:700;font-size:16px;word-break:break-all}
.card .m{font-size:13px;color:var(--sub);margin-top:3px}
.card .grow{flex:1;min-width:0}
.card.ghost{opacity:.6}
.btn{height:42px;padding:0 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;white-space:nowrap}
.btn.sub{background:#f1f3f7;color:var(--ink)}
.btn.red{background:#fdecee;color:#c4001c}
.note{font-size:13px;color:var(--sub);line-height:1.6}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:9px;background:#fdecee;color:#c4001c;margin-left:6px}
.tag.blue{background:var(--accent-soft);color:var(--accent)}

/* review */
#review{display:flex;flex-direction:column;overflow:hidden}
#rvHead{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
#rvBody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#rvStage{position:relative;margin:14px auto 160px;background:#fff;box-shadow:0 1px 4px rgba(20,30,50,.18);touch-action:pan-x pan-y}
body.fd #rvStage{touch-action:none}
#rvStage canvas{position:absolute;left:0;top:0;display:block}
#rvStage .calc{position:absolute;left:0;right:0;border-top:2px dashed var(--line);color:#b0b7c3;font-size:13px;padding:6px 10px;pointer-events:none}
#rvGrade{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px;
  background:#fff;padding:10px;border-radius:22px;box-shadow:0 4px 18px rgba(20,30,50,.2);z-index:3}
.gb{width:84px;height:68px;border-radius:16px;font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f6f7fa}
.gb small{font-size:11px;color:var(--sub);margin-top:2px}
.rvinfo{max-width:900px;margin:12px auto 0;padding:0 16px;font-size:14px;color:var(--sub)}

/* sheet / dialog */
#veil{position:fixed;inset:0;background:rgba(15,20,30,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:#fff;width:min(560px,100%);border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
#sheet h3{margin:0 0 12px;font-size:18px}
#sheet p{margin:0 0 14px;line-height:1.6;font-size:15px}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;padding:10px 12px;border-radius:12px;text-align:left;font-size:16px}
.opt:active{background:#f1f3f7}
.opt + .opt{border-top:1px solid #eef0f4}
.opt .s{font-size:13px;color:var(--sub)}
.sw2{width:50px;height:30px;border-radius:15px;background:#cfd5de;position:relative;flex:none}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw2.on{background:#34c759} .sw2.on::after{left:23px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .btn{height:56px;font-size:16px}
input.txt{width:100%;height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:18px;margin-bottom:14px;-webkit-user-select:text;user-select:text}
#login{display:flex;align-items:center;justify-content:center;background:#f3f6fb}
.pinbox{text-align:center;padding:24px;max-width:420px;width:100%}
#pinDots{display:flex;gap:16px;justify-content:center;margin:6px 0 10px}
#pinDots span{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent)}
#pinDots span.on{background:var(--accent)}
#pinMsg{min-height:24px;color:#c4001c;font-size:14px;margin-bottom:10px}
.keys{display:grid;grid-template-columns:repeat(3,84px);gap:14px;justify-content:center}
.keys button{width:84px;height:84px;border-radius:50%;background:#fff;font-size:30px;font-weight:600;box-shadow:0 1px 4px rgba(20,30,50,.15)}
.keys button:active{background:var(--accent-soft)}
#viewBar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:#fff6db;border-bottom:1px solid #f0d78c;font-size:15px}
#viewFollow.on{background:var(--accent);color:#fff}
#advTools{display:none;position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;
  align-items:center;gap:2px;padding:6px 8px;background:#fff;border-radius:20px;box-shadow:0 4px 18px rgba(20,30,50,.18);max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center;border:2px solid #0a9b5c}
body.viewing #advTools{display:flex}
.advlabel{font-size:12px;font-weight:800;color:#0a9b5c;padding:0 6px}
.ov>.advtx{height:auto;font-size:calc(var(--fs) * var(--u) * 1px);color:var(--c);background:rgba(255,255,255,.9);border:2px solid var(--c);
  border-radius:10px;padding:.25em .45em;font-weight:700;line-height:1.4;white-space:pre-wrap;word-break:break-all;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.ov>.advtx::before{content:"💬 ";font-size:.8em}
.ov>.advau{width:auto;height:auto;pointer-events:auto;display:flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;border-radius:24px;
  background:#0a9b5c;color:#fff;font-weight:800;font-size:17px;box-shadow:0 3px 10px rgba(0,0,0,.25);cursor:pointer;transform:translate(-50%,-50%);touch-action:manipulation}
.ov>.advau .ic{font-size:20px}
.ov>.advau.lecb{background:#7c3aed}
.ov>.advau.vidb{background:#0f172a}
.recbtn.play{border-color:var(--accent);color:var(--accent);font-size:30px;width:72px;height:72px}
#lec.hidden{display:none!important}
#lecWrap{overflow:hidden}
.ov>.advau.new{animation:aupulse 1.4s ease-in-out infinite}
.ov>.advau.new::after{content:"NEW";font-size:10px;background:#ffd23f;color:#5a4300;border-radius:8px;padding:1px 5px;margin-left:2px}
.ov>.advau.play{background:#e11d48}
@keyframes aupulse{0%,100%{box-shadow:0 0 0 0 rgba(10,155,92,.55)}50%{box-shadow:0 0 0 12px rgba(10,155,92,0)}}
.recbtn{width:96px;height:96px;border-radius:50%;background:#fff;border:6px solid #e11d48;color:#e11d48;font-size:40px;font-weight:900}
.recbtn.on{background:#e11d48;color:#fff;animation:aupulse 1.2s infinite}
.ov>.advimg{border:3px solid #0a9b5c;border-radius:8px;background:#fff;object-fit:contain;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#btnAdv.on{background:#e7f7ef;outline:2px solid #0a9b5c}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(10,15,25,.9);display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:96vw;max-height:92vh;border-radius:8px;background:#fff}
.lightbox .ib{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:#fff}
body.viewing #tools, body.viewing #btnReview, body.viewing #btnCoin, body.viewing #btnMore, body.viewing #memoClear{display:none!important}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(25,30,40,.92);color:#fff;
  padding:12px 18px;border-radius:14px;font-size:15px;z-index:60;max-width:90vw;text-align:center;line-height:1.5;pointer-events:none;transition:opacity .2s;opacity:0}
#toast.show{opacity:1}
.cf{position:fixed;width:10px;height:14px;border-radius:2px;z-index:55;pointer-events:none}
.bigstamp{position:fixed;z-index:56;pointer-events:none;font-size:90px;font-weight:900}
</style>
</head>
<body>
<div id="app" class="hidden">
  <header id="top">
    <button id="btnLib" class="ib" aria-label="本棚">📚</button>
    <div id="bookTitle"></div>
    <div id="stats"></div>
    <div class="sp"></div>
    <span id="cloud"></span>
    <button id="btnZoomOut" class="ib" aria-label="小さく">－</button>
    <button id="btnZoomIn" class="ib" aria-label="大きく">＋</button>
    <button id="btnPage" class="pill">1 / 1</button>
    <button id="btnAdv" class="ib hidden" aria-label="アドバイスの表示">💬</button>
    <button id="btnMemo" class="ib" aria-label="計算メモ">📝</button>
    <button id="btnCoin" class="pill">🪙 <span id="coinNum">0</span></button>
    <button id="btnRed" class="ib" aria-label="赤シート">🟥</button>
    <button id="btnMaskAll" class="ib" aria-label="穴うめ全部">🙈</button>
    <button id="btnReview" class="pill">🔁 復習 <b id="dueCount">0</b></button>
    <button id="btnMore" class="ib" aria-label="メニュー">⋯</button>
  </header>
  <div id="viewBar" class="hidden"><span id="viewText"></span><div class="sp"></div>
    <button id="viewFollow" class="pill">ついていく</button><button id="viewExit" class="pill">おわる</button></div>
  <div id="mainArea">
    <main id="viewer"><div id="pages"></div></main>
    <div id="memo" class="hidden">
      <div class="mhead"><span class="grip">⋮⋮</span><b id="memoTitle">📝 メモ</b><div class="sp"></div>
        <button id="memoClear" class="pill" style="height:36px">全部消す</button>
        <button id="memoClose" class="ib" aria-label="メモを閉じる">✕</button></div>
      <div id="memoBody"><div id="memoStage"><canvas></canvas></div></div>
      <div id="memoResize" aria-label="大きさを変える">⇲</div>
    </div>
  </div>
  <div id="redsheet" class="hidden"></div>
  <div id="redgrip" class="hidden">⇕ 赤シート</div>
  <nav id="advTools"></nav>
  <nav id="tools">
    <div id="toolBtns"></div>
    <div id="row2">
      <div id="opts"></div>
      <div class="sep"></div>
      <button id="btnUndo" class="ib" aria-label="元に戻す">↶</button>
      <button id="btnRedo" class="ib" aria-label="やり直す">↷</button>
      <button id="btnToolsHide" class="ib" aria-label="ツールをかくす" style="font-size:16px">▾</button>
    </div>
    <button id="toolsMini" class="tool" aria-label="ツールを出す"></button>
  </nav>
</div>

<section id="lib" class="screen">
  <div class="wrap">
    <h1>📚 トキノート</h1>
    <div class="row" id="learners"></div>
    <button id="btnAdd" class="big">＋ 問題集のPDFを入れる</button>
    <button id="btnLibReview" class="big sub">🔁 間違えた問題の復習 <span id="libDue"></span></button>
    <button id="btnLibReward" class="big sub">🎁 ごほうび（🪙 <span id="libCoin">0</span>）</button>
    <button id="btnLibWatch" class="big sub hidden">👀 見守る（ほかの端末で書いている様子を見る）</button>
    <div id="todayBox" class="note"></div>
    <h2>本棚</h2>
    <div id="bookList"></div>
    <h2>保存について</h2>
    <p class="note" id="saveNote"></p>
  </div>
</section>

<section id="review" class="screen hidden">
  <div id="rvHead">
    <button id="rvBack" class="pill">← もどる</button>
    <div id="rvTitle" style="font-weight:700"></div>
    <div class="sp"></div>
    <span id="rvTools">
      <button id="rvPen" class="ib on" aria-label="ペン">✏️</button>
      <button id="rvEraser" class="ib" aria-label="消す">🧽</button>
      <button id="rvUndo" class="ib" aria-label="元に戻す">↶</button>
      <button id="rvClear" class="pill">全部消す</button>
    </span>
  </div>
  <div id="rvBody"></div>
  <div id="rvGrade" class="hidden">
    <button class="gb" data-m="o">⭕<small>できた</small></button>
    <button class="gb" data-m="t">🔺<small>おしい</small></button>
    <button class="gb" data-m="x">❌<small>まだ</small></button>
    <button class="gb" data-m="skip" style="font-size:20px">⏭<small>あとで</small></button>
  </div>
</section>

<section id="rewardScr" class="screen hidden"><div class="wrap" id="rwBody"></div></section>

<section id="login" class="screen hidden" style="z-index:30">
  <div class="pinbox">
    <div style="font-size:54px">📚</div><h1 style="margin:6px 0 4px">トキノート</h1>
    <p class="note" style="margin:0 0 18px">パスコードを入れてください</p>
    <div id="pinDots"></div><div id="pinMsg"></div>

const b64u8 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
class BundledCMapFactory{
  constructor(){}

/* ================= utils ================= */
const uid = (p='') => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
const rnd = v => Math.round(v);

const withTimeout = (p, ms) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}), ms))]);
const timers = new Map(), timerFns = new Map();
// アプリを閉じる・切りかえるときは、待っている保存をすぐ実行する
function flushDebounced(){ for(const [k,t] of timers){ clearTimeout(t); const f=timerFns.get(k); timers.delete(k); try{ f?.(); }catch{} } try{ Cloud.flush(); }catch{} }
addEventListener('pagehide', flushDebounced);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushDebounced(); });
function debounce(key, fn, ms){ timerFns.set(key, fn); clearTimeout(timers.get(key)); timers.set(key, setTimeout(()=>{ timers.delete(key); fn(); }, ms)); }
let toastT;
function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), ms); }

/* ================= local storage (IndexedDB) ================= */
let mem = null, dbp = null;
const req = r => new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const done = t => new Promise((res,rej)=>{ t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); });
function openDB(){
  if(!dbp) dbp = new Promise((res,rej)=>{
    let r; try{ r = indexedDB.open('tokinote', 1); }catch(e){ rej(e); return; }
    r.onupgradeneeded = () => { const d=r.result; for(const s of STORES) if(!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
  });
  return dbp;
}
const store = {
  async get(s,k){ if(mem) return mem[s].get(k); const d=await openDB(); return req(d.transaction(s).objectStore(s).get(k)); },
  async put(s,k,v){ if(mem){ mem[s].set(k,v); return; } const d=await openDB(); const t=d.transaction(s,'readwrite'); t.objectStore(s).put(v,k); await done(t); },
  async del(s,k){ if(mem){ mem[s].delete(k); return; } const d=await openDB(); const t=d.transaction(s,'readwrite'); t.objectStore(s).delete(k); await done(t); },
  async range(s,prefix){
    if(mem) return [...mem[s]].filter(([k])=>String(k).startsWith(prefix));
    const d=await openDB(); const os=d.transaction(s).objectStore(s);
    const kr = IDBKeyRange.bound(prefix, prefix+'￿');
    const [ks,vs] = await Promise.all([req(os.getAllKeys(kr)), req(os.getAll(kr))]);
    return ks.map((k,i)=>[k,vs[i]]);
  },
  all(s){ return this.range(s,''); },
  // 中身を読まずに名前だけ（PDFや動画が大きくても軽い）
  async keys(s){ if(mem) return [...mem[s].keys()]; const d=await openDB(); return req(d.transaction(s).objectStore(s).getAllKeys()); }
};
async function initStore(){
  try{ await withTimeout(openDB(), 5000); }
  catch(e){ mem={}; for(const s of STORES) mem[s]=new Map(); toast('この画面では端末に保存できません。閉じると書き込みが消えます', 7000); }
  try{ await navigator.storage?.persist?.(); }catch{}
}

/* ================= cloud ================= */
// 2つの保存先に対応：
//  'cf'     … 自分のCloudflare Worker（/api/*）。パスコードでログインし、見守り（リアルタイム）も使える
//  'claude' … claude.ai アーティファクトのDB（ログイン中ユーザーの非公開領域）
const api = (path, opt={}) => fetch(path, {credentials:'same-origin', cache:'no-store', ...opt});
const Cloud = {
  mode:null, db:null, base:'', st:'connecting', q:new Map(), busy:new Set(), timer:null, warned:{},
  async init(){
    // まず Cloudflare 版かどうかを確かめる（claude.ai の中ではこの通信は止められる）
    try{
      const r = await withTimeout(api('api/health'), 6000);
      if(r.ok){ const j=await r.json(); if(j.app==='tokinote'){
        if(!j.configured){ await showSetupNeeded(); return; }
        if(!j.authed) await showLogin();
        this.mode='cf'; this.db=true; this.set('on'); Live.connect(); return; } }
    }catch{}
    try{
      if(!window.claude || typeof window.claude.use !== 'function'){ this.set('off'); return; }
      const [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if(!db || !user){ this.set('off'); return; }
      const id = await user.id(); if(!id){ this.set('off'); return; }
      this.mode='claude'; this.db = db; this.base = 'data/users/' + id; this.set('on');
    }catch(e){ this.set('off'); }
  },
  set(s){ this.st=s; renderCloud(); },
  doc(path){ return this.db.doc(this.base + '/' + path); },
  put(path, body, force){ if(!this.db || (state.viewOnly && !force)) return; this.q.set(path, body); clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(), this.mode==='cf'?800:2000); },
  async write(path, body){
    if(this.mode==='cf'){
      const r = await api('api/kv?key='+encodeURIComponent(path), {method:'PUT', headers:{'content-type':'application/json'}, body:JSON.stringify(body)});
      if(r.status===401){ throw {code:'auth'}; }
      if(r.status===413) throw {code:'invalid_argument'};
      if(!r.ok) throw {code:'unavailable'};
      return;
    }
    return this.doc(path).set(body);
  },
  async flush(){
    if(!this.db) return;
    for(const [path,body] of [...this.q]){
      if(this.busy.has(path)) continue;
      this.q.delete(path); this.busy.add(path); this.set('saving');
      try{ await this.write(path, body); }
      catch(e){
        const c = e?.code;
        if(c==='invalid_argument'){ if(!this.warned.big){ this.warned.big=1; toast('書き込みがとても多いページはクラウドに保存できませんでした（この端末には保存済み）', 6000);} }
        else if(c==='quota_exceeded'){ if(!this.warned.q){ this.warned.q=1; toast('クラウドの保存容量がいっぱいです（この端末には保存済み）', 6000);} }
        else if(c==='auth'){ if(!this.q.has(path)) this.q.set(path, body); this.busy.delete(path); await showLogin(); }
        else if(['revoked','not_granted','capability_disabled','capability_removed'].includes(c)){ this.db=null; this.set('off'); return; }
        else if(!this.q.has(path)) this.q.set(path, body);
      }finally{ this.busy.delete(path); }
    }
    if(this.q.size){ clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(), 4000); } else this.set('on');
  },
  async get(path){
    if(!this.db) return null;
    try{
      if(this.mode==='cf'){ const r=await withTimeout(api('api/kv?key='+encodeURIComponent(path)), 10000); return r.ok ? await r.json() : null; }
      const s=await withTimeout(this.doc(path).get(), 10000); return s.exists ? clone(s.data()) : null;
    }catch{ return null; }
  },
  async list(colPath, where){
    if(!this.db) return [];
    try{
      if(this.mode==='cf'){
        const q=new URLSearchParams({col:colPath||''}); if(where){ q.set('field',where[0]); q.set('value',where[2]); }
        const r=await withTimeout(api('api/kv/list?'+q), 15000); return r.ok ? await r.json() : [];
      }
      let q = this.db.collection(this.base + (colPath ? '/'+colPath : '')); if(where) q = q.where(...where);
      const s = await withTimeout(q.get(), 10000); return s.docs.map(d=>({id:d.id, data:clone(d.data())}));
    }catch{ return []; }
  },
  // PDF本体（Cloudflare版だけ）
  async hasPdf(id){ if(this.mode!=='cf') return false; try{ const r=await api('api/pdf/'+id, {method:'HEAD'}); return r.ok; }catch{ return false; } },
  async uploadPdf(id, buf, name){
    if(this.mode!=='cf') return false;
    if(await this.hasPdf(id)) return true;
    try{ const r=await api(`api/pdf/${id}?name=${encodeURIComponent(name||'')}`, {method:'PUT', headers:{'content-type':'application/pdf'}, body:buf});
      if(r.status===413){ toast('PDFが大きすぎてクラウドに置けませんでした（95MBまで）。この端末では使えます', 6000); return false; }
      return r.ok; }catch{ return false; }
  },
  async downloadPdf(id){
    if(this.mode!=='cf') return null;
    try{ const r=await api('api/pdf/'+id); return r.ok ? await r.arrayBuffer() : null; }catch{ return null; }
  }
};

/* ================= Live（見守り：Cloudflare版だけ） ================= */
const Live = {
  ws:null, open:false, retry:0, lastSend:0, pending:null, timer:null, onMsg:null,
  connect(){
    if(Cloud.mode!=='cf') return;
    try{
      const u=new URL('api/live', location.href); u.protocol = u.protocol==='https:'?'wss:':'ws:';
      const ws=new WebSocket(u); this.ws=ws;
      ws.onopen=()=>{ this.open=true; this.retry=0; if(state.viewOnly) this.send({t:'hello'}); else sendCur(); };
      ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch{ return; } onLiveMsg(m); };
      ws.onclose=()=>{ this.open=false; this.ws=null; const d=Math.min(30000, 1000*2**this.retry++); setTimeout(()=>this.connect(), d); };
      ws.onerror=()=>{ try{ ws.close(); }catch{} };
    }catch{}
  },
  send(m){ if(this.open && this.ws?.readyState===1){ try{ this.ws.send(JSON.stringify(m)); }catch{} } },
  // 書いている途中の線は、0.08秒に1回だけ送る
  // 書き終えたら、まだ送っていない「途中の線」を捨て、終わりの合図を送る（遅れて届いた途中の線が残るのを防ぐ）
  endLive(info){
    clearTimeout(this.timer); this.timer=null; this.pending=null;
    if(info && this.open && (!state.viewOnly || info.area==='adv')) this.send({t:'liveEnd', L:state.learner, b:state.book?.id, ...info});
  },
  sendLive(m){
    if(!this.open || (state.viewOnly && m.area!=='adv')) return;
    this.pending=m; const now=Date.now();
    if(now-this.lastSend>=80){ this.lastSend=now; this.send(m); this.pending=null; }
    else if(!this.timer) this.timer=setTimeout(()=>{ this.timer=null; if(this.pending){ this.lastSend=Date.now(); this.send(this.pending); this.pending=null; } }, 80);
  }
};
setInterval(()=>Live.send({t:'ping'}), 25000);
function sendCur(){ if(Cloud.mode!=='cf' || state.viewOnly || !state.book) return; Live.send({t:'cur', L:state.learner, b:state.book.id, p:state.curPage, name:state.book.name}); }

/* ---- merges ---- */
function mergeLearn(a, b){
  if(!a) return clone(b); if(!b) return a;
  const out = {marks:{}, lastPage: (b.updated>a.updated? b.lastPage : a.lastPage) ?? 0, updated: Math.max(a.updated||0, b.updated||0)};
  const ids = new Set([...Object.keys(a.marks||{}), ...Object.keys(b.marks||{})]);
  for(const id of ids){
    const map = new Map();
    for(const m of [...(a.marks?.[id]||[]), ...(b.marks?.[id]||[])]){
      const k = m.d+'|'+m.m; const prev = map.get(k);
      if(!prev) map.set(k, {...m}); else if(!prev.r && m.r) prev.r = m.r;
    }
    out.marks[id] = [...map.values()].sort((x,y)=>x.d-y.d);
  }
  return out;
}
const sameLearn = (a,b) => JSON.stringify(a?.marks||{})===JSON.stringify(b?.marks||{}) && (a?.lastPage||0)===(b?.lastPage||0);
function mergeStats(a,b){
  const out={days:{...(a?.days||{})}, updated:Math.max(a?.updated||0,b?.updated||0)};
  for(const [d,v] of Object.entries(b?.days||{})){ const o=out.days[d]||{}; out.days[d]={o:Math.max(o.o||0,v.o||0),t:Math.max(o.t||0,v.t||0),x:Math.max(o.x||0,v.x||0),sec:Math.max(o.sec||0,v.sec||0)}; }
  return out;
}

async function syncBookFromCloud(b){

/* ================= SRS (復習) ================= */
function srsOf(marks){
  let st='new', box=0, due=0, last=null;
  for(const m of [...(marks||[])].sort((a,b)=>a.d-b.d)){
    last=m;
    if(m.m==='o'){
      if(st==='new') st='ok';
      else if(st==='review'){ box++; if(box>INTERVALS.length) st='grad'; else due = m.d + INTERVALS[box-1]*DAY; }
    } else { st='review'; box=0; due=m.d; }
  }
  return {st, box, due, last, left: st==='review' ? INTERVALS.length+1-box : 0};
}
function reviewItems(){
  const items=[]; const eod=endOfDay();
  for(const [b,l] of state.learnAll){
    const sh = state.sharedAll.get(b);
    for(const [pid, marks] of Object.entries(l.marks||{})){
      if(!marks.length) continue;
      let prob=null, page=null;
      if(pid.startsWith('pg')) page=+pid.slice(2);
      else { prob = sh?.problems?.find(q=>q.id===pid); if(!prob) continue; page=prob.p; }
      const s = srsOf(marks);
      items.push({b, pid, prob, page, s, isDue: s.st==='review' && s.due<=eod, book: sh?.name || '問題集'});
    }
  }
  return items;
}
function refreshDue(){
  const n = reviewItems().filter(i=>i.isDue).length;
  $('#dueCount').textContent = n; $('#libDue').textContent = n ? `（${n}問）` : '';
}
function problemStatus(b, pid){
  const s = srsOf(getLearn(b).marks[pid]);
  if(s.st==='new') return {cls:'', icon:''};
  if(s.st==='ok') return {cls:'ok', icon:'⭕'};
  if(s.st==='grad') return {cls:'grad', icon:'🏆'};
  return {cls:'ng', icon: s.last?.m==='o' ? '🔁' : s.last?.m==='t' ? '🔺' : '❌'};
}

function tone(f, t0, dur, type='triangle', vol=.16){
  const a=audio(); if(!a) return; const o=a.createOscillator(), g=a.createGain(); const now=a.currentTime;
  o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0.0001, now+t0); g.gain.exponentialRampToValueAtTime(vol, now+t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, now+t0+dur); o.connect(g).connect(a.destination); o.start(now+t0); o.stop(now+t0+dur+.05);
}

/* ================= drawing ================= */
const bboxCache = new WeakMap();
function bbox(it){
  let b=bboxCache.get(it); if(b) return b;
  const p=it.p; let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(let i=0;i<p.length;i+=3){ x0=Math.min(x0,p[i]); x1=Math.max(x1,p[i]); y0=Math.min(y0,p[i+1]); y1=Math.max(y1,p[i+1]); }
  b={x0,y0,x1,y1}; bboxCache.set(it,b); return b;
}
function drawItem(ctx, it, s){
  if(it.k==='s'){
    const p=it.p; ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=it.c; ctx.fillStyle=it.c;
    if(it.t==='mk'){
      ctx.globalAlpha=.38; ctx.lineWidth=it.w*s; ctx.beginPath(); ctx.moveTo(p[0]*s,p[1]*s);
      if(p.length===3) ctx.lineTo(p[0]*s+.5,p[1]*s); for(let i=3;i<p.length;i+=3) ctx.lineTo(p[i]*s,p[i+1]*s); ctx.stroke();
    } else {
      if(p.length===3){ ctx.beginPath(); ctx.arc(p[0]*s,p[1]*s,it.w*s*.5,0,Math.PI*2); ctx.fill(); }
      for(let i=3;i<p.length;i+=3){
        const pr=(p[i+2]+p[i-1])/200; ctx.lineWidth=Math.max(.6, it.w*s*(.45+pr*1.1));
        ctx.beginPath(); ctx.moveTo(p[i-3]*s,p[i-2]*s); ctx.lineTo(p[i]*s,p[i+1]*s); ctx.stroke();
      }
    }
    ctx.restore();
  } else if(it.k==='m'){
    const x=it.x*s, y=it.y*s, r=it.s*s/2; ctx.save(); ctx.strokeStyle=STAMP_C[it.m]; ctx.lineWidth=r*.17; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    if(it.m==='o') ctx.arc(x,y,r*.82,0,Math.PI*2);
    else if(it.m==='t'){ ctx.moveTo(x,y-r*.8); ctx.lineTo(x+r*.85,y+r*.65); ctx.lineTo(x-r*.85,y+r*.65); ctx.closePath(); }
    else { ctx.moveTo(x-r*.7,y-r*.7); ctx.lineTo(x+r*.7,y+r*.7); ctx.moveTo(x+r*.7,y-r*.7); ctx.lineTo(x-r*.7,y+r*.7); }
    ctx.stroke(); ctx.restore();
  }
}
function drawAll(cv, items, s){ const ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height); s ??= cv.width/10000; for(const it of items) drawItem(ctx,it,s); }
function segDist2(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay; const l=dx*dx+dy*dy; let t=l?((px-ax)*dx+(py-ay)*dy)/l:0; t=Math.max(0,Math.min(1,t)); const x=ax+t*dx-px, y=ay+t*dy-py; return x*x+y*y; }

  const b=bbox(it); const R=rad+it.w/2;
  if(pt.x<b.x0-R||pt.x>b.x1+R||pt.y<b.y0-R||pt.y>b.y1+R) return false;
  const p=it.p, R2=R*R;
  if(p.length===3) return (p[0]-pt.x)**2+(p[1]-pt.y)**2<R2;
  for(let i=3;i<p.length;i+=3) if(segDist2(pt.x,pt.y,p[i-3],p[i-2],p[i],p[i+1])<R2) return true;
  return false;
}
const pressureOf = e => rnd(100 * ((e.pointerType==='pen' && e.pressure>0) ? e.pressure : .5));

const undoMain=[], redoMain=[], undoRv=[], redoRv=[];
const stacks = () => state.screen==='solve' ? [undoRv, redoRv] : [undoMain, redoMain];
function pushUndo(op, which){ const [u,r] = which==='rv' ? [undoRv,redoRv] : [undoMain,redoMain]; u.push(op); if(u.length>300) u.shift(); r.length=0; updUndo(); }
function doUndo(){ const [u,r]=stacks(); const op=u.pop(); if(!op) return; op.undo(); r.push(op); updUndo(); }

const touches = new Map(); let pan=null, cur=null, tapC=null;
const live = document.createElement('canvas'); live.className='live';
let liveRAF=0;
function scheduleLive(){ if(liveRAF) return; liveRAF=requestAnimationFrame(()=>{ liveRAF=0; if(cur?.kind!=='stroke') return; const ctx=live.getContext('2d'); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,live.width,live.height); if(cur.T.drawLive) cur.T.drawLive(ctx, cur.item); else drawItem(ctx, cur.item, live.width/10000); }); }
function toNorm(e, el, T){ if(T.toPt) return T.toPt(e); const r=el.getBoundingClientRect(); const k=10000/T.getW(); return {x:(e.clientX-r.left)*k, y:(e.clientY-r.top)*k}; }
const mid = () => { const v=[...touches.values()]; return {x:(v[0].x+v[1].x)/2, y:(v[0].y+v[1].y)/2}; };
function notePen(){
  if(state.settings.penSeen) return;

  if(state.settings.fingerDraw){ state.settings.fingerDraw=false; applyTouchMode(); toast('Apple Pencilを見つけました。これから指はスクロール用です（⋯ で変更できます）', 5500); }
  saveMeta();
}
function applyTouchMode(){
  const drawTool = !['hand'].includes(state.screen==='solve' ? 'pen' : state.tool);
  document.body.classList.toggle('fd', state.settings.fingerDraw && drawTool);
}
function attachInput(el, T){ el.addEventListener('pointerdown', e=>onDown(e,el,T)); }
// 指やペンを離した合図は、どこで起きても必ず受け取る（取りこぼして描けなくなるのを防ぐ）

  }

    if(T.forceColor) item.c=T.forceColor;

function onUp(e, cancel){

function finishCur(c, cancel, ev){

function abortCur(){ if(!cur) return; if(cur.kind==='tapTool'){ cur=null; return; } if(cur.kind==='stroke' && cur.T.liveInfo && Cloud.mode==='cf') Live.endLive(cur.T.liveInfo()); if(cur.kind==='stroke') live.remove(); if(cur.kind==='rect') cur.rb.remove(); if(cur.kind==='erase' && cur.removed.length) cur.T.commitErase(cur.removed); cur=null; }
function eraseAt(c, pt){

  for(let i=items.length-1;i>=0;i--){ const it=items[i]; if(it.k!=='s') continue; if(hitStroke(it,pt,ERASE_R)){ items.splice(i,1); c.removed.push(it); ch=true; } }
  if(ch) c.T.inkRedraw();
}
const normRect = (x0,y0,x1,y1) => ({x:rnd(Math.min(x0,x1)), y:rnd(Math.min(y0,y1)), w:rnd(Math.abs(x1-x0)), h:rnd(Math.abs(y1-y0))});
function setRect(d,r){ d.style.setProperty('--x',r.x); d.style.setProperty('--y',r.y); d.style.setProperty('--w',r.w); d.style.setProperty('--h',r.h); }
// Pencil は常に描画、指だけスクロールさせる（iPadOS Safari の touchType）
function guardStylus(el){
  const h = e => { if(state.screen!=='solve' && state.tool==='hand') return; for(const t of e.touches) if(t.touchType==='stylus'){ e.preventDefault(); return; } };
  el.addEventListener('touchstart', h, {passive:false}); el.addEventListener('touchmove', h, {passive:false});

let io=null;
function pixelRatioFor(w,h){ let r=Math.min(window.devicePixelRatio||1, 2); const max=9e6; if(w*h*r*r>max) r=Math.sqrt(max/(w*h)); return r; }
/* --- 回転：書き込みは「元の向き」の座標で保存し、表示の時だけ回す --- */
function geomOf(a, rot, gs=0){
  const H=10000*a; let m, Dw, Dh;
  if(rot===90){ m=[0,1,-1,0,H,0]; Dw=H; Dh=10000; }
  else if(rot===180){ m=[-1,0,0,-1,10000,H]; Dw=10000; Dh=H; }
  else if(rot===270){ m=[0,-1,1,0,0,10000]; Dw=H; Dh=10000; }
  else { rot=0; m=[1,0,0,1,0,0]; Dw=10000; Dh=H+gs; }
  return {rot, a, H, m, Dw, Dh};
}
const toD=(g,x,y)=>({x:g.m[0]*x+g.m[2]*y+g.m[4], y:g.m[1]*x+g.m[3]*y+g.m[5]});
function toB(g,x,y){ const H=g.H; switch(g.rot){ case 90: return {x:y, y:H-x}; case 180: return {x:10000-x, y:H-y}; case 270: return {x:10000-y, y:x}; default: return {x,y}; } }
function rectMap(f, g, r){ const a=f(g,r.x,r.y), b=f(g,r.x+r.w,r.y+r.h); return {x:Math.min(a.x,b.x), y:Math.min(a.y,b.y), w:Math.abs(b.x-a.x), h:Math.abs(b.y-a.y)}; }
const pageRot = p => ((state.shared?.rot?.[p])||0);
function drawOnPage(ctx, items, g, k, ox=0, oy=0){
  for(const it of items){
    if(it.k==='m'){ ctx.setTransform(k,0,0,k,-ox,-oy); const d=toD(g,it.x,it.y); drawItem(ctx, {...it, x:d.x, y:d.y}, 1); }
    else { const m=g.m; ctx.setTransform(k*m[0],k*m[1],k*m[2],k*m[3],k*m[4]-ox,k*m[5]-oy); drawItem(ctx, it, 1); }
  }
  ctx.setTransform(1,0,0,1,0,0);
}
/* --- すきま（問題と問題のあいだに書くスペースを足す）：ページを上下に分けて、方眼の白いスペースを入れる ---
   すきまは子どもごと・ページごと（ink の gaps）。書き込みは「すきま込みの座標」、問題わく・穴うめは元のページの座標で持つ */
const pageGaps = p => pageRot(p) ? [] : ((state.ink.get(p)?.gaps)||[]).slice().sort((a,b)=>a.y-b.y);
function b2e(g, y){ let o=0; for(const q of g.gaps||[]){ if(q.y<=y) o+=q.h; else break; } return y+o; }
function e2b(g, y){ let o=0; for(const q of g.gaps||[]){ const s=q.y+o; if(y<s) break; if(y<s+q.h) return null; o+=q.h; } return y-o; }
function e2bc(g, y){ let o=0; for(const q of g.gaps||[]){ const s=q.y+o; if(y<s) break; if(y<s+q.h) return q.y; o+=q.h; } return y-o; }
const rectBE = (g, r) => { if(!g.gaps?.length) return r; const y1=b2e(g,r.y), y2=b2e(g,r.y+r.h); return {...r, y:y1, h:y2-y1}; };
function gapSegments(g){
  const segs=[]; let b0=0, off=0;
  for(const q of g.gaps||[]){ segs.push({b0, b1:q.y, off}); off+=q.h; b0=q.y; }
  segs.push({b0, b1:g.H, off}); return segs;
}
// PDFを（すきまがあれば区切って）描く。k=キャンバスの1単位あたりのピクセル、ox/oy=キャンバスのずらし
async function paintPdf(ctx, page, rotation, g, k, ox, oy, cw, ch, setTask, alive){
  if(!alive()) return;
  const vp1=page.getViewport({scale:1, rotation}); const scale=k*g.Dw/vp1.width;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cw,ch);
  if(!g.gaps?.length){
    const vp=page.getViewport({scale, rotation, offsetX:-ox, offsetY:-oy});
    const t=page.render({canvasContext:ctx, viewport:vp}); setTask(t); await t.promise; return;
  }
  for(const s of gapSegments(g)){
    if(!alive()) return;
    const y0=(s.b0+s.off)*k-oy, y1=(s.b1+s.off)*k-oy; if(y1<0 || y0>ch) continue;
    ctx.save(); ctx.beginPath(); ctx.rect(0, y0, cw, y1-y0); ctx.clip();
    const vp=page.getViewport({scale, rotation, offsetX:-ox, offsetY:s.off*k-oy});
    const t=page.render({canvasContext:ctx, viewport:vp}); setTask(t); await t.promise; ctx.restore();
    if(!alive()) return;
  }
  if(!alive()) return;    // 古い描画（拡大の前の大きさ）が、新しいキャンバスに描かないように
  let off=0;
  for(const q of g.gaps){
    const top=(q.y+off)*k-oy, h=q.h*k; off+=q.h; if(top+h<0 || top>ch) continue;
    ctx.fillStyle='#fbfcff'; ctx.fillRect(0, top, cw, h);
    ctx.strokeStyle='#e3e8f1'; ctx.lineWidth=1; ctx.beginPath();
    const step=280*k; for(let y=top+step; y<top+h; y+=step){ ctx.moveTo(0,y); ctx.lineTo(cw,y); } for(let x=(-ox%step+step)%step; x<cw; x+=step){ ctx.moveTo(x,top); ctx.lineTo(x,top+h); } ctx.stroke();
    ctx.setLineDash([10,8]); ctx.strokeStyle='#9fb4d6'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,top+1); ctx.lineTo(cw,top+1); ctx.moveTo(0,top+h-1); ctx.lineTo(cw,top+h-1); ctx.stroke(); ctx.setLineDash([]);
  }
}
const itemMinY = it => { if(it.k==='s'){ let m=Infinity; for(let i=1;i<it.p.length;i+=3) m=Math.min(m,it.p[i]); return m; } return it.y; };
function shiftItem(it, dy){ if(it.k==='s'){ for(let i=1;i<it.p.length;i+=3) it.p[i]+=dy; } else it.y+=dy; }
function relayoutPage(p){
  const pg=state.pages[p]; if(!pg) return; const was=pg.rendered;
  layoutPages(); unrenderPage(pg); if(was) renderPage(pg);
}
function applyGapState(p, st){
  const rec=getInk(p); rec.items=clone(st.items); rec.gaps=clone(st.gaps); saveInk(p);
  const a=state.adv.get(p); if(a && JSON.stringify(a.items)!==JSON.stringify(st.adv)){ a.items=clone(st.adv); saveAdv(p); }
  relayoutPage(p);
}
async function gapAt(pg, pt){
  const p=pg.i; if(pageRot(p)){ toast('回転したページには、すきまを入れられません'); return; }
  const rec=getInk(p); const gaps=pageGaps(p);
  const snap=()=>({items:clone(rec.items), adv:clone(state.adv.get(p)?.items||[]), gaps:clone(rec.gaps||[])});
  const before=snap(); const after=snap();
  const allItems=[...after.items, ...after.adv];
  let off=0, hit=null, top=0;
  for(const q of gaps){ const s=q.y+off; if(pt.y>=s && pt.y<s+q.h){ hit=q; top=s; break; } off+=q.h; }
  if(hit){
    const r=await openSheet(`<h3>↕️ すきま</h3><div class="grid2" style="margin-bottom:10px"><button class="btn sub" data-a="more">もっと広く</button><button class="btn sub" data-a="less">せまく</button></div>
      <div class="grid2"><button class="btn red" data-a="del">すきまを消す</button><button class="btn" data-a="0">とじる</button></div>`,
      close=>$('#sheet').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>close(b.dataset.a)));
    if(!r || r==='0') return;
    const g=after.gaps.find(q=>q.y===hit.y && q.h===hit.h); const bottom=top+hit.h;
    if(r==='del'){
      const inside=allItems.filter(it=>{ const y=itemMinY(it); return y>=top && y<bottom; });
      if(inside.length && !(await confirmDlg('すきまを消す',`このすきまに書いた ${inside.length} 個の書きこみも消えます。（↶で戻せます）`,'消す',true))) return;
      after.items=after.items.filter(it=>!inside.includes(it)); after.adv=after.adv.filter(it=>!inside.includes(it));
      for(const it of [...after.items, ...after.adv]) if(itemMinY(it)>=bottom) shiftItem(it, -hit.h);
      after.gaps=after.gaps.filter(q=>q!==g);
    } else {
      const dh = r==='more' ? Math.round(hit.h*.5) : -Math.min(hit.h-800, Math.round(hit.h/3));
      if(!dh) return;
      for(const it of allItems) if(itemMinY(it)>=bottom) shiftItem(it, dh);
      g.h+=dh;
    }
  } else {
    const yB=e2b(pg.g, pt.y); if(yB==null) return;
    const H=2600;
    for(const it of allItems) if(itemMinY(it)>=pt.y) shiftItem(it, H);
    after.gaps.push({y:Math.round(yB), h:H});
    toast('↕️ すきまを入れました。すきまをタップすると、広さを変えたり消したりできます', 3000);
  }
  after.gaps.sort((a,b)=>a.y-b.y);
  applyGapState(p, after);
  pushUndo({undo:()=>applyGapState(p, before), redo:()=>applyGapState(p, after)});
}
function buildPages(){
  const host=$('#pages'); host.innerHTML=''; state.pages=[];
  io?.disconnect();
  io=new IntersectionObserver(ents=>{ for(const en of ents){ const pg=state.pages[+en.target.dataset.p]; if(!pg) continue; if(en.isIntersecting) renderPage(pg); else unrenderPage(pg); } }, {root:$('#viewer'), rootMargin:'80% 0px'});
  for(let i=0;i<state.book.pages;i++){
    const el=document.createElement('div'); el.className='page'; el.dataset.p=i;
    el.innerHTML='<canvas class="pdf"></canvas><canvas class="ink"></canvas><div class="ov"></div><div class="pno">'+(i+1)+'</div>';
    host.appendChild(el);
    const pg={i, el, pdfCv:el.children[0], inkCv:el.children[1], ov:el.children[2], rendered:false, task:null, gen:0, w:0, h:0, px:0, g:null};
    state.pages.push(pg); attachInput(el, pageTarget(pg));
  }
  layoutPages();
  for(const pg of state.pages) io.observe(pg.el);
}
function layoutPages(){
  const vw=$('#viewer').clientWidth; const base=Math.min(vw-24, 1100);
  state.pages.forEach((pg,i)=>{
    const gaps=pageGaps(i); pg.g=geomOf(state.book.aspects[i]||1.414, pageRot(i), gaps.reduce((s,q)=>s+q.h,0)); pg.g.gaps=gaps;
    // 横向きページは同じ幅に入れると小さくなりすぎるので、縦向きと同じ高さ感にそろえる
    const W=Math.round(base*state.zoom);
    pg.w=W; pg.h=Math.round(W*pg.g.Dh/pg.g.Dw);
    pg.el.style.width=pg.w+'px'; pg.el.style.height=pg.h+'px'; pg.el.style.setProperty('--u', pg.w/pg.g.Dw);
  });
}
async function renderPage(pg){
  if(pg.rendered) return; pg.rendered=true; const gen=++pg.gen;
  const r=pixelRatioFor(pg.w,pg.h); const cw=Math.floor(pg.w*r), ch=Math.floor(pg.h*r);
  for(const cv of [pg.pdfCv,pg.inkCv]){ cv.width=cw; cv.height=ch; cv.style.width=pg.w+'px'; cv.style.height=pg.h+'px'; }
  pg.px = cw/pg.g.Dw; pg.ratio=r;
  drawInk(pg); renderOverlay(pg);
  try{
    const page=await state.pdf.getPage(pg.i+1); if(gen!==pg.gen) return;
    const rotation=((page.rotate||0)+pg.g.rot)%360;
    await paintPdf(pg.pdfCv.getContext('2d'), page, rotation, pg.g, pg.px, 0, 0, cw, ch, t=>pg.task=t, ()=>gen===pg.gen);
  }catch(e){ if(e?.name!=='RenderingCancelledException') console.warn(e); }
  finally{ if(gen===pg.gen) pg.task=null; }
  scheduleDetails();
}
/* --- 大きく拡大したときは、見えている部分だけを高画質で描き直す --- */
const wantRatio = () => Math.min(window.devicePixelRatio||1, 2);
function scheduleDetails(){ debounce('detail', ()=>{ if(!state.book) return; for(const pg of state.pages){ if(pg.rendered && pg.ratio < wantRatio()*.9) renderDetail(pg); else removeDetail(pg); } }, 160); }
async function renderDetail(pg){
  const v=$('#viewer'), vr=v.getBoundingClientRect(), pr=pg.el.getBoundingClientRect();
  const mx=vr.width*.15, my=vr.height*.15;
  const x0=Math.max(0, vr.left-mx-pr.left), y0=Math.max(0, vr.top-my-pr.top);
  const x1=Math.min(pg.w, vr.right+mx-pr.left), y1=Math.min(pg.h, vr.bottom+my-pr.top);
  if(x1<=x0 || y1<=y0){ removeDetail(pg); return; }
  const rect={x:Math.floor(x0), y:Math.floor(y0), w:Math.ceil(x1-x0), h:Math.ceil(y1-y0)};
  let rD=wantRatio(); if(rect.w*rect.h*rD*rD>8e6) rD=Math.sqrt(8e6/(rect.w*rect.h));
  if(rD <= pg.ratio*1.05){ removeDetail(pg); return; }
  const o=pg.detail;
  if(o && Math.abs(o.r-rD)<.01 && o.rect.x<=rect.x && o.rect.y<=rect.y && o.rect.x+o.rect.w>=rect.x+rect.w && o.rect.y+o.rect.h>=rect.y+rect.h) return;
  pg.dgen=(pg.dgen||0)+1; const gen=pg.dgen; try{ pg.dtask?.cancel(); }catch{}
  const el=document.createElement('div'); el.style.cssText=`position:absolute;left:${rect.x}px;top:${rect.y}px;width:${rect.w}px;height:${rect.h}px;pointer-events:none`;
  const pc=document.createElement('canvas'), ic=document.createElement('canvas');
  for(const c of [pc,ic]){ c.width=Math.floor(rect.w*rD); c.height=Math.floor(rect.h*rD); c.style.cssText=`position:absolute;left:0;top:0;width:${rect.w}px;height:${rect.h}px`; }
  el.append(pc,ic);
  try{
    const page=await state.pdf.getPage(pg.i+1); if(gen!==pg.dgen || !pg.rendered) return;
    const rotation=((page.rotate||0)+pg.g.rot)%360;
    await paintPdf(pc.getContext('2d'), page, rotation, pg.g, rD*pg.w/pg.g.Dw, rect.x*rD, rect.y*rD, pc.width, pc.height, t=>pg.dtask=t, ()=>gen===pg.dgen && pg.rendered); pg.dtask=null;
  }catch(e){ if(e?.name!=='RenderingCancelledException') console.warn(e); return; }
  if(gen!==pg.dgen || !pg.rendered){ pc.width=pc.height=ic.width=ic.height=0; return; }
  dropDetail(pg); pg.detail={el,pc,ic,rect,r:rD}; pg.el.insertBefore(el, pg.ov); drawDetailInk(pg);
}
function dropDetail(pg){ const d=pg.detail; if(!d) return; d.el.remove(); d.pc.width=d.pc.height=d.ic.width=d.ic.height=0; pg.detail=null; }
function removeDetail(pg){ pg.dgen=(pg.dgen||0)+1; try{ pg.dtask?.cancel(); }catch{} pg.dtask=null; dropDetail(pg); }
const detailK = pg => pg.detail.r*pg.w/pg.g.Dw;

function removeShared(list, obj, p){

      const rec=getInk(p); rec.items.push(item); drawOnPage(pg.inkCv.getContext('2d'), [item], pg.g, pg.px);
      const d=pg.detail; if(d) drawOnPage(d.ic.getContext('2d'), [item], pg.g, detailK(pg), d.rect.x*d.r, d.rect.y*d.r); saveInk(p);
      pushUndo({undo:()=>{ const r=getInk(p); const j=r.items.indexOf(item); if(j>=0) r.items.splice(j,1); drawInk(pg); saveInk(p); },
                redo:()=>{ getInk(p).items.push(item); drawInk(pg); saveInk(p); }});
    },
    commitErase(list){
      if(state.viewOnly){ saveAdv(p);
        pushUndo({undo:()=>{ getAdv(p).items.push(...list); drawInk(pg); saveAdv(p); },
                  redo:()=>{ const a=getAdv(p); a.items=a.items.filter(it=>!list.includes(it)); drawInk(pg); saveAdv(p); }}); return; }
      saveInk(p);
      pushUndo({undo:()=>{ getInk(p).items.push(...list); drawInk(pg); saveInk(p); },
                redo:()=>{ const r=getInk(p); r.items=r.items.filter(it=>!list.includes(it)); drawInk(pg); saveInk(p); }});
    },
    stamp(pt, m, e){ stampAt(pg, pt, m, e); },
    gap(pt){ gapAt(pg, pt); },
    rect(kind, r){
      const b=state.book.id, sh=state.shared;
      if(pg.g.gaps?.length){ const y1=e2bc(pg.g,r.y), y2=e2bc(pg.g,r.y+r.h); if(y2-y1<80){ toast('すきまの中には作れません'); return; } r={...r, y:Math.round(y1), h:Math.round(y2-y1)}; }
      if(kind==='region'){
        const n=Math.max(0,...sh.problems.map(q=>q.n||0))+1;
        const q={id:uid('q'), p, ...r, n};
        const redo=()=>{ sh.problems.push(q); saveShared(b); renderOverlay(pg); };
        const undo=()=>{ const j=sh.problems.indexOf(q); if(j>=0) sh.problems.splice(j,1); saveShared(b); renderOverlay(pg); refreshDue(); };
        redo(); pushUndo({undo,redo}); toast(`問${n} を登録しました`, 1400);
      } else {
        const m={id:uid('k'), p, ...r};
        const redo=()=>{ sh.masks.push(m); saveShared(b); renderOverlay(pg); };
        const undo=()=>{ const j=sh.masks.indexOf(m); if(j>=0) sh.masks.splice(j,1); saveShared(b); renderOverlay(pg); };
        redo(); pushUndo({undo,redo});
      }
    },
    tap(pt, e){
      if(state.viewOnly && state.advTool==='aaud'){ advAudioAt(pg, pt); return; }
      if(state.viewOnly && state.advTool==='alec'){ openLecRecorder(pg, pt); return; }
      if(state.viewOnly && state.advTool==='avid'){ advVideoAt(pg, pt); return; }
      if(state.viewOnly && (state.advTool==='atext'||state.advTool==='aimg')){ advTextAt(pg, pt, e); return; }
      if(e && !state.advHidden){ const h=advHit(pg,e); if(h?.k==='im'){ imgURL(h.img).then(u=>u&&showLightbox(u)); return; } }
      const by=e2b(pg.g, pt.y); if(by==null) return; const bpt={x:pt.x, y:by};
      const hit = state.shared.masks.filter(m=>m.p===p && bpt.x>=m.x && bpt.x<=m.x+m.w && bpt.y>=m.y && bpt.y<=m.y+m.h);
      if(!hit.length) return;
      if(state.revealAll){ state.revealAll=false; state.revealed=new Set(state.shared.masks.map(m=>m.id)); }
      for(const m of hit){ state.revealed.has(m.id) ? state.revealed.delete(m.id) : state.revealed.add(m.id); }
      renderOverlay(pg); renderMaskBtn();
    }
  };
}
function findProblem(p, pt){
  const g=state.pages[p]?.g; if(g?.gaps?.length){ const y=e2b(g, pt.y); if(y==null) return null; pt={x:pt.x, y}; }
  const c = state.shared.problems.filter(q=>q.p===p && pt.x>=q.x && pt.x<=q.x+q.w && pt.y>=q.y && pt.y<=q.y+q.h);
  c.sort((a,b)=>a.w*a.h-b.w*b.h); return c[0]?.id || null;
}
function stampAt(pg, pt, m, e){
  const p=pg.i, b=state.book.id, rec=getInk(p);
  const near = rec.items.find(it=>it.k==='m' && Math.hypot(it.x-pt.x, it.y-pt.y) < it.s*.5);
  const learn=getLearn(b);
  if(near){ // もう一度タップで消す
    const pid=near.pid; let saved=null, idx=-1;
    const redo=()=>{ const j=getInk(p).items.indexOf(near); if(j>=0) getInk(p).items.splice(j,1);
      const arr=learn.marks[pid]||[]; idx=arr.findIndex(x=>x.sid===near.id); if(idx>=0){ saved=arr[idx]; arr.splice(idx,1); bumpStat(saved.d, saved.m, -1); }
      drawInk(pg); saveInk(p); saveLearn(b); renderOverlay(pg); updateCoins(); };
    const undo=()=>{ getInk(p).items.push(near); if(saved){ (learn.marks[pid] ||= []).push(saved); bumpStat(saved.d, saved.m, +1); }
      drawInk(pg); saveInk(p); saveLearn(b); renderOverlay(pg); updateCoins(); };
    redo(); pushUndo({undo,redo}); return;
  }
  const pid = findProblem(p, pt) || ('pg'+p);
  const it={k:'m', m, x:rnd(pt.x), y:rnd(pt.y), s:STAMP_S, id:uid('s'), pid};
  const mark={m, d:Date.now(), sid:it.id};
  const redo=()=>{ getInk(p).items.push(it); (learn.marks[pid] ||= []).push(mark); bumpStat(mark.d, m, +1); drawInk(pg); saveInk(p); saveLearn(b); renderOverlay(pg); };
  const undo=()=>{ const r=getInk(p); const j=r.items.indexOf(it); if(j>=0) r.items.splice(j,1);
    const arr=learn.marks[pid]||[]; const k=arr.indexOf(mark); if(k>=0){ arr.splice(k,1); bumpStat(mark.d, m, -1); }
    drawInk(pg); saveInk(p); saveLearn(b); renderOverlay(pg); updateCoins(); };
  redo(); pushUndo({undo,redo});
  celebrate(m, e.clientX, e.clientY);
  if(m!=='o') askReason(mark, b);
}

function rotatePages(list){
  if(!state.book) return; const b=state.book.id, sh=state.shared;
  const before=clone(sh.rot||{});
  const apply=(r)=>{ sh.rot=r; saveShared(b); relayout(); };
  const skip=list.filter(p=>(state.ink.get(p)?.gaps||[]).length); list=list.filter(p=>!skip.includes(p));
  if(skip.length) toast(`すきまのあるページ（${skip.length}ページ）は回転しませんでした`, 3000); if(!list.length) return;
  const after={...before}; for(const p of list){ after[p]=(((after[p]||0)+90)%360); if(!after[p]) delete after[p]; }
  apply(clone(after)); pushUndo({undo:()=>apply(clone(before)), redo:()=>apply(clone(after))});
}

/* ================= current page / zoom ================= */
function currentPageFromScroll(){
  const v=$('#viewer'); const y=v.scrollTop + v.clientHeight*.35;
  for(const pg of state.pages){ if(pg.el.offsetTop + pg.h >= y) return pg.i; }
  return state.pages.length-1;
}
$('#viewer').addEventListener('scroll', ()=>{
  state.lastAct=Date.now(); if(!state.book) return;
  scheduleDetails();
  const p=currentPageFromScroll(); if(p!==state.curPage){ state.curPage=p; renderPageBtn(); if(state.memoOpen) showMemoFor(p); sendCur(); renderViewBar(); }
  debounce('lastpage', ()=>{ if(!state.book) return; const l=getLearn(state.book.id); if(l.lastPage!==state.curPage){ l.lastPage=state.curPage; saveLearn(state.book.id); } }, 2500);

const ZMIN=.5, ZMAX=10;
// 画面上の点(sx,sy)の下にある場所を、拡大後も同じ位置に保つ
function zoomAround(z, sx, sy){
  if(!state.book) return; z=Math.max(ZMIN, Math.min(ZMAX, Math.round(z*100)/100));
  const v=$('#viewer'); const r=v.getBoundingClientRect();
  const cx=v.scrollLeft+sx-r.left, cy=v.scrollTop+sy-r.top;
  let pg=state.pages.find(q=>q.el.offsetTop+q.h>=cy) || state.pages[state.pages.length-1];
  const fx=(cx-pg.el.offsetLeft)/pg.w, fy=(cy-pg.el.offsetTop)/pg.h;
  state.zoom=z; state.pages.forEach(unrenderPage); layoutPages();
  v.scrollTop = pg.el.offsetTop + fy*pg.h - (sy-r.top);
  v.scrollLeft = pg.el.offsetLeft + fx*pg.w - (sx-r.left);
  io.disconnect(); state.pages.forEach(x=>io.observe(x.el));
  store.put('meta','zoom',z).catch(()=>{});
  scheduleDetails();
}
function setZoom(z){ const v=$('#viewer'), r=v.getBoundingClientRect(); zoomAround(z, r.left+r.width/2, r.top+r.height*.35); }
function relayout(){ if(!state.book) return; zoomAround(state.zoom, $('#viewer').getBoundingClientRect().left + 10, $('#viewer').getBoundingClientRect().top + 10); }
let resizeT; window.addEventListener('resize', ()=>{ clearTimeout(resizeT); resizeT=setTimeout(()=>{ if(state.book && state.screen==='main') relayout(); if(state.memoOpen) placeMemo(); placeRed(); }, 250); });
/* ピンチで拡大・縮小（2本指）。指を離すと、その倍率できれいに描き直す */
(()=>{
  const v=$('#viewer'), pages=$('#pages'); let pin=null;
  const fingers = e => [...e.touches].filter(t=>t.touchType!=='stylus');
  const dist = t => Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const midp = t => ({x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2});
  v.addEventListener('touchstart', e=>{
    const t=fingers(e); if(t.length!==2 || !state.book) return;
    e.preventDefault(); abortCur();
    const m=midp(t), r=v.getBoundingClientRect();
    pin={d0:dist(t), m0:m, m, s:1, ox:v.scrollLeft+m.x-r.left, oy:v.scrollTop+m.y-r.top};
    pages.style.transformOrigin=`${pin.ox}px ${pin.oy}px`;
  }, {passive:false});
  v.addEventListener('touchmove', e=>{
    if(!pin) return; const t=fingers(e); if(t.length<2) return; e.preventDefault();
    pin.m=midp(t); pin.s=Math.max(ZMIN/state.zoom, Math.min(ZMAX/state.zoom, dist(t)/pin.d0));
    pages.style.transform=`translate(${pin.m.x-pin.m0.x}px,${pin.m.y-pin.m0.y}px) scale(${pin.s})`;
  }, {passive:false});
  const end = e=>{
    if(!pin || fingers(e).length>=2) return; const p=pin; pin=null;
    pages.style.transform=''; pages.style.transformOrigin='';
    const r=v.getBoundingClientRect();
    if(Math.abs(p.s-1)<0.03){ v.scrollLeft-= (p.m.x-p.m0.x); v.scrollTop-=(p.m.y-p.m0.y); return; }
    // ピンチ開始時の点を、指を離した位置に合わせる
    v.scrollLeft = p.ox - (p.m0.x - r.left); v.scrollTop = p.oy - (p.m0.y - r.top);
    zoomAround(state.zoom*p.s, p.m0.x, p.m0.y);
    v.scrollLeft -= (p.m.x-p.m0.x); v.scrollTop -= (p.m.y-p.m0.y);
  };
  v.addEventListener('touchend', end); v.addEventListener('touchcancel', end);
  document.addEventListener('gesturestart', e=>e.preventDefault());
})();

  else if(a==='clearAll'){ if(!state.book) return; if(await confirmDlg('全ページの書き込みを消す', 'この問題集の線をすべて消します。丸つけと記録は残ります。↶で戻せます。', '全部消す', true)) clearStrokes([...state.ink.keys()]); }
  else if(a==='backup') exportBackup();

}
function clearStrokes(pages){
  const saved=new Map();
  const redo=()=>{ for(const p of pages){ const r=getInk(p); saved.set(p, r.items.filter(it=>it.k==='s')); r.items=r.items.filter(it=>it.k!=='s'); saveInk(p); const pg=state.pages[p]; if(pg) drawInk(pg); } };
  const undo=()=>{ for(const [p,list] of saved){ getInk(p).items.unshift(...list); saveInk(p); const pg=state.pages[p]; if(pg) drawInk(pg); } };
  redo(); pushUndo({undo,redo}); toast('書き込みを消しました（↶で戻せます）');
}

async function exportBackup(){
  let dl=null; try{ dl = await window.claude?.use?.('downloads'); }catch{}
  if(!dl){ toast('この画面ではファイル保存ができません'); return; }
  const data={}; for(const s of ['books','shared','learn','ink','meta']) data[s]=await store.all(s);
  const json=JSON.stringify({app:'tokinote', v:1, at:new Date().toISOString(), data});
  try{ await dl.save({filename:`tokinote-backup-${dateKey()}.json`, data:new Blob([json],{type:'application/json'})}); toast('バックアップを保存しました'); }
  catch(e){ toast(e?.code==='declined' ? '保存をやめました' : 'バックアップを保存できませんでした'); }
}
$('#fileJson').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const j=JSON.parse(await f.text()); if(j.app!=='tokinote') throw 0;
    let n=0;
    for(const [k,v] of j.data.books||[]){ if(!(await store.get('books',k))){ await store.put('books',k,v); n++; } }
    for(const [k,v] of j.data.shared||[]){ const l=await store.get('shared',k); if(!l || (v.updated||0)>(l.updated||0)){ await store.put('shared',k,v); n++; } }
    for(const [k,v] of j.data.learn||[]){ const l=await store.get('learn',k); const m=mergeLearn(l,v); await store.put('learn',k,m); n++; }
    for(const [k,v] of j.data.ink||[]){ const l=await store.get('ink',k); if(!l || (v.updated||0)>(l.updated||0)){ await store.put('ink',k,v); n++; } }
    for(const [k,v] of j.data.meta||[]){ if(String(k).startsWith('stats|')){ const l=await store.get('meta',k); await store.put('meta',k,mergeStats(l,v)); } }

async function sha(buf){ const h=await crypto.subtle.digest('SHA-256', buf); return [...new Uint8Array(h)].slice(0,10).map(x=>x.toString(16).padStart(2,'0')).join(''); }
$('#filePdf').onchange=async e=>{
  const files=[...e.target.files]; e.target.value=''; let last=null;
  for(const f of files){
    try{
      toast(`「${f.name}」を読み込み中…`, 8000);
      const buf=await f.arrayBuffer(); const id=await sha(buf);
      const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0)), ...PDF_OPTS}).promise;
      const aspects=[]; for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i); const vp=pg.getViewport({scale:1}); aspects.push(vp.height/vp.width); }
      const name=f.name.replace(/\.pdf$/i,'');
      const exist=await store.get('books', id);
      await store.put('files', id, buf);
      await store.put('books', id, {...(exist||{}), id, name: exist?.name || name, pages:pdf.numPages, aspects, added: exist?.added || Date.now(), lastOpened:Date.now()});
      pdf.destroy();
      const sh=getShared(id); if(!sh.name){ sh.name=name; sh.pages=aspects.length; saveShared(id); }
      pushBookToCloud(id, buf);
      last=id;
    }catch(err){ console.warn(err); toast(`「${f.name}」は開けませんでした（パスワード付きや壊れたPDFの可能性）`, 5000); }
  }
  if(last){ toast('追加しました', 1200); if(files.length===1) openBook(last); else renderLib(); }
};

async function ensureLocalBook(id){
  let meta=await store.get('books', id), file=await store.get('files', id);
  if(meta && file) return true;
  if(Cloud.mode!=='cf') return false;
  toast('クラウドからPDFを取り寄せています…', 20000);
  const buf=await Cloud.downloadPdf(id); if(!buf){ toast('クラウドにこのPDFがありません'); return false; }
  try{
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0)), ...PDF_OPTS}).promise;
    const aspects=[]; for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i); const vp=pg.getViewport({scale:1}); aspects.push(vp.height/vp.width); }
    pdf.destroy();
    const cb=await Cloud.get(`bk_${id}`);
    const name=cb?.name || getShared(id).name || 'PDF';
    await store.put('files', id, buf);
    await store.put('books', id, {...(meta||{}), id, name, pages:aspects.length, aspects, added:Date.now(), lastOpened:Date.now()});
    toast('取り寄せました', 1200); return true;
  }catch(e){ console.warn(e); toast('PDFを開けませんでした'); return false; }
}
async function openBook(id){
  if(!(await ensureLocalBook(id))){ toast('PDFが見つかりません。もう一度入れてください'); return; }
  const meta=await store.get('books', id); const file=await store.get('files', id);
  showScreen('main'); $('#pages').innerHTML='<div class="loading">ひらいています…</div>';
  $('#bookTitle').textContent=meta.name;
  try{
    if(state.pdf && state.pdfId!==id){ try{ state.pdf.destroy(); }catch{} state.pdf=null; }
    if(!state.pdf) state.pdf = await pdfjsLib.getDocument({data:new Uint8Array(file.slice(0)), ...PDF_OPTS}).promise;
    state.pdfId=id;
  }catch(e){ console.warn(e); toast('PDFを開けませんでした'); showScreen('lib'); return; }
  meta.lastOpened=Date.now(); store.put('books', id, meta).catch(()=>{});
  state.book=meta; state.shared=getShared(id); state.revealed.clear(); state.revealAll=false; renderMaskBtn();
  undoMain.length=0; redoMain.length=0; updUndo();
  const rows=await store.range('ink', `${state.learner}|${id}|`);

  syncBookFromCloud(id);
}

const rv={queue:[], idx:0, items:[], tool:'pen', W:0, cropH:0, done:{o:0,t:0,x:0}};
const pdfCache=new Map();
async function getPdfFor(b){
  if(state.pdfId===b && state.pdf) return state.pdf;
  if(pdfCache.has(b)) return pdfCache.get(b);
  const file=await store.get('files', b); if(!file) return null;
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(file.slice(0)), ...PDF_OPTS}).promise;
  for(const [k,v] of pdfCache){ try{v.destroy();}catch{} pdfCache.delete(k); }
  pdfCache.set(b,pdf); return pdf;
}

async function showSolve(){
  state.screen='solve'; applyTouchMode(); undoRv.length=0; redoRv.length=0;
  const it=rv.queue[rv.idx];
  if(!it){ return finishReview(); }
  $('#rvTools').classList.remove('hidden'); $('#rvGrade').classList.remove('hidden');
  $('#rvTitle').textContent=`復習 ${rv.idx+1} / ${rv.queue.length}`;
  const label= it.prob ? `問${it.prob.n}（${it.page+1}ページ）` : `${it.page+1}ページ`;
  $('#rvBody').innerHTML=`<div class="rvinfo">${esc(it.book)} ・ ${label}${it.s.last?.r?` ・ 前回：${esc(it.s.last.r)}`:''}</div><div id="rvStage"><div class="loading">読み込み中…</div></div>`;
  const pdf=await getPdfFor(it.b).catch(()=>null);
  const stage=$('#rvStage');
  if(!pdf){ stage.innerHTML=`<div class="loading">この問題集のPDFがこの端末にありません。本棚から同じPDFを入れ直してください。</div>`; return; }
  const page=await pdf.getPage(it.page+1); const vp1=page.getViewport({scale:1});
  const asp=vp1.height/vp1.width; const extraRot=(state.sharedAll.get(it.b)?.rot?.[it.page])||0; const g=geomOf(asp, extraRot);
  const rB = it.prob ? {x:it.prob.x, y:it.prob.y, w:it.prob.w, h:it.prob.h} : {x:0, y:0, w:10000, h:10000*asp};
  const r = rectMap(toD, g, rB);
  const W=Math.min($('#rvBody').clientWidth-24, 900); const cropH=Math.round(W*r.h/r.w); const extra=Math.max(320, Math.round(cropH*.8));
  rv.W=W; rv.cropH=cropH; rv.items=[];
  stage.innerHTML=''; stage.style.width=W+'px'; stage.style.height=(cropH+extra)+'px';
  const ratio=pixelRatioFor(W, cropH+extra);
  const crop=document.createElement('canvas'); crop.width=Math.floor(W*ratio); crop.height=Math.floor(cropH*ratio); crop.style.width=W+'px'; crop.style.height=cropH+'px';
  const calc=document.createElement('div'); calc.className='calc'; calc.style.top=cropH+'px'; calc.textContent='ここに計算や答えを書こう';
  const ink=document.createElement('canvas'); ink.width=Math.floor(W*ratio); ink.height=Math.floor((cropH+extra)*ratio); ink.style.width=W+'px'; ink.style.height=(cropH+extra)+'px';
  stage.append(crop, calc, ink); rv.ink=ink;
  const ptsPerU=vp1.width/10000, scale=crop.width/(r.w*ptsPerU), rotation=((page.rotate||0)+g.rot)%360;
  const vp=page.getViewport({scale, rotation, offsetX:-r.x*ptsPerU*scale, offsetY:-r.y*ptsPerU*scale});
  const ctx=crop.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,crop.width,crop.height);
  try{ await page.render({canvasContext:ctx, viewport:vp}).promise; }catch(e){ console.warn(e); }
  $('#rvBody').scrollTop=0;
}
const rvTarget = {
  getW:()=>rv.W, tool:()=>rv.tool==='eraser'?'eraser':'pen', canDraw:()=>!!rv.ink, scroller:()=>$('#rvBody'),
  items:()=>rv.items, inkCanvas:()=>rv.ink, ovEl:()=>null, forceColor:null,
  inkRedraw:()=>drawAll(rv.ink, rv.items),
  addStroke(item){ rv.items.push(item); drawItem(rv.ink.getContext('2d'), item, rv.ink.width/10000);
    pushUndo({undo:()=>{ const j=rv.items.indexOf(item); if(j>=0) rv.items.splice(j,1); drawAll(rv.ink,rv.items); }, redo:()=>{ rv.items.push(item); drawAll(rv.ink,rv.items); }}, 'rv'); },
  commitErase(list){ pushUndo({undo:()=>{ rv.items.push(...list); drawAll(rv.ink,rv.items); }, redo:()=>{ rv.items=rv.items.filter(x=>!list.includes(x)); drawAll(rv.ink,rv.items); }}, 'rv'); }
};

function memoBox(){

// 見出しをつかんで移動、右下の ⇲ で大きさを変える
function dragHandle(el, onMove){
  let st=null;
  el.addEventListener('pointerdown', e=>{
    if(e.target.closest('button')) return;
    e.preventDefault(); e.stopPropagation(); try{ el.setPointerCapture(e.pointerId); }catch{}
    st={id:e.pointerId, x:e.clientX, y:e.clientY, b:memoBox()};
  });
  el.addEventListener('pointermove', e=>{ if(!st||e.pointerId!==st.id) return; e.preventDefault(); placeMemo(onMove(st.b, e.clientX-st.x, e.clientY-st.y)); });
  const end=e=>{ if(!st||e.pointerId!==st.id) return; const b=onMove(st.b, e.clientX-st.x, e.clientY-st.y); st=null; state.settings.memoBox=b; saveMeta(); placeMemo(); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}

    pushUndo({undo:()=>{ const a=memoItems(p); const j=a.indexOf(item); if(j>=0) a.splice(j,1); saveInk(p); if(memoPage===p) drawMemo(); },
              redo:()=>{ memoItems(p).push(item); saveInk(p); if(memoPage===p) drawMemo(); }}); },
  commitErase(list){ const p=memoPage; saveInk(p);
    pushUndo({undo:()=>{ memoItems(p).push(...list); saveInk(p); if(memoPage===p) drawMemo(); },
              redo:()=>{ const r=getInk(p); r.memo=(r.memo||[]).filter(x=>!list.includes(x)); saveInk(p); if(memoPage===p) drawMemo(); }}); }

const COIN={o:10, t:5, x:2, rvo:15, grad:30};
const STICKERS=Array.from('🐶🐱🐰🦊🐻🐼🐨🐯🦁🐮🐷🐸🐵🐧🐤🦄🐝🦋🐢🐬🐳🦖🐙🦀🍓🍉🍩🍰🌈⭐🌙🌸🌻🍀🎈🎨🎵🚀👑💎');

function coinTotals(){
  let earned=0;
  for(const l of state.learnAll.values()) for(const marks of Object.values(l.marks||{})){
    const best=new Map();
    for(const m of marks){ const k=dateKey(m.d); const v = m.m==='o' ? (m.rv?COIN.rvo:COIN.o) : m.m==='t' ? COIN.t : COIN.x; best.set(k, Math.max(best.get(k)||0, v)); }
    for(const v of best.values()) earned+=v;
    if(marks.length && srsOf(marks).st==='grad') earned+=COIN.grad;
  }
  for(const d of Object.values(state.stats.days||{})) earned += Math.min(6, Math.floor((d.sec||0)/600))*10;
  const spent=(state.rewards?.spent||[]).reduce((a,x)=>a+(x.cost||0),0);
  return {earned, spent, now:Math.max(0, earned-spent)};
}

  if(lastEarned!=null && Math.floor(c.earned/100)>Math.floor(lastEarned/100)){
    const n=Math.floor(c.earned/100); setTimeout(()=>toast(`🎉 新しいシール ${STICKERS[(n-1)%STICKERS.length]} をゲット！`, 3500), 700);

    if(m.area==='memo'){ if(state.memoOpen && memoPage===m.p){ drawAll(memoCv, memoItems().concat([m.item])); } return; }

    drawOnPage(ctx, [m.item], pg.g, pg.px);
  } else if(m.t==='stats'){
    state.stats=m.stats; renderStats(); updateCoins();
  } else if(m.t==='learn'){
    state.learnAll.set(m.b, m.learn); store.put('learn', learnKey(m.b), m.learn).catch(()=>{});

  }
}

function advReplace(p, oldIt, newIt){

          $('#recSend').disabled=false; $('#recSend').style.opacity=1; $('#recPlay').style.display='flex'; };

const LEC={mode:null, a:4/3*0+0.75, bg:null, bgImg:null, ev:[], cur:null, t0:0, rec:null, chunks:[], stream:null, mime:'', audioBlob:null, dur:0, timer:null, color:'#1d2330', target:null, play:null};

// 時刻 T までの状態を描く（録画中は T=Infinity）
function lecDraw(T=Infinity){
  const cv=$('#lecCv'), ctx=cv.getContext('2d'); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  const s=cv.width/10000; let strokes=[];
  for(const e of LEC.ev){
    if(e.t>T) break;
    if(e.k==='clear') strokes=[]; else if(e.k==='undo') strokes.pop();
    else if(e.k==='s') strokes.push(e);
  }
  for(const e of strokes){
    let p=e.p; if(T!==Infinity){ let n=0; while(n<p.length && p[n+2]<=T) n+=3; if(n<p.length) p=p.slice(0,n); }
    if(!p.length) continue;
    drawItem(ctx, {k:'s', t:'pen', c:e.c, w:e.w, p:p.map((v,i)=>i%3===2?50:v)}, s);
  }
}
function lecTools(){
  const recOn = LEC.rec?.state==='recording';
  const done = !recOn && LEC.audioBlob!==null && LEC.mode==='rec';
  if(LEC.mode==='play'){ $('#lecBar').innerHTML=`<button class="ib" data-l="close">✕</button><b>🎬 ${esc(LEC.play?.title||'解説')}</b>`; return; }
  $('#lecBar').innerHTML = `<button class="ib" data-l="close">✕</button><b>🎬 解説を録る</b><div class="sp"></div>`
    + (LEC.ev.length||recOn ? '' : `<button class="pill" data-l="bg">${LEC.bg?'📄 白紙にする':'📄 このページを下じきに'}</button>`)
    + LEC_COLORS.map(c=>`<button class="sw ${LEC.color===c?'on':''}" data-c="${c}" style="background:${c}"></button>`).join('')
    + `<button class="ib" data-l="undo">↶</button><button class="pill" data-l="clear">全部消す</button>`;
  $('#lecCtl').innerHTML = done
    ? `<button class="btn sub" data-l="redo">やり直す</button><button class="btn sub" data-l="preview">▶ 確かめる</button><button class="btn" data-l="send">送る（${fmtSec(LEC.dur/1000)}）</button>`
    : `<button id="lecRec" class="recbtn ${recOn?'on':''}" data-l="rec">${recOn?'■':'●'}</button><div id="lecTime" style="font-size:22px;font-weight:800;min-width:70px">${fmtSec(recOn?lecNow()/1000:0)}</div>
       <div class="note" style="max-width:260px">${recOn?'書きながら話してください（最大5分）。■で止める':'●を押すと、声と書いた線の録画が始まります'}</div>`;
}
async function openLecRecorder(pg, pt){
  LEC.mode='rec'; LEC.target={p:pg.i, pt}; LEC.ev=[]; LEC.bg=null; LEC.a=0.75; LEC.audioBlob=null; LEC.dur=0; LEC.t0=0; LEC.color=state.advColor||'#1d2330';
  $('#lecBg').removeAttribute('src'); $('#lec').classList.remove('hidden'); lecSize(); lecTools(); lecDraw();
}
async function lecSetBg(on){
  if(!on){ LEC.bg=null; LEC.bgBuf=null; LEC.a=0.75; $('#lecBg').removeAttribute('src'); lecSize(); lecDraw(); lecTools(); return; }
  const p=LEC.target.p; const page=await state.pdf.getPage(p+1); const rot=((page.rotate||0)+pageRot(p))%360;
  const vp1=page.getViewport({scale:1, rotation:rot}); const vp=page.getViewport({scale:1400/vp1.width, rotation:rot});
  const c=document.createElement('canvas'); c.width=Math.round(vp.width); c.height=Math.round(vp.height);
  const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); await page.render({canvasContext:ctx, viewport:vp}).promise;
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.8)); LEC.bgBuf=await blob.arrayBuffer();
  LEC.bg=URL.createObjectURL(blob); LEC.a=c.height/c.width; $('#lecBg').src=LEC.bg; lecSize(); lecDraw(); lecTools();
}
async function lecStart(){
  if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){ toast('この画面では録音できません'); return; }
  try{ LEC.stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch{ toast('マイクが使えません。設定でマイクを許可してください', 5000); return; }
  LEC.mime=pickMime(); LEC.chunks=[]; LEC.ev=[];
  LEC.rec=new MediaRecorder(LEC.stream, LEC.mime?{mimeType:LEC.mime}:undefined);
  LEC.rec.ondataavailable=e=>{ if(e.data.size) LEC.chunks.push(e.data); };
  LEC.rec.onstop=()=>{ LEC.audioBlob=new Blob(LEC.chunks,{type:LEC.rec.mimeType||LEC.mime||'audio/mp4'}); LEC.stream.getTracks().forEach(t=>t.stop()); lecTools(); };
  LEC.rec.start(250); LEC.t0=performance.now(); lecDraw(); lecTools();
  LEC.timer=setInterval(()=>{ const s=lecNow()/1000; const el=$('#lecTime'); if(el) el.textContent=fmtSec(s); if(s>=300) lecStop(); }, 250);
}
function lecStop(){ clearInterval(LEC.timer); if(LEC.cur){ LEC.ev.push(LEC.cur); LEC.cur=null; } LEC.dur=lecNow(); try{ LEC.rec?.state==='recording' && LEC.rec.stop(); }catch{} }
// 書く（録画中だけ）
(()=>{
  const cv=$('#lecCv'); let id=null;
  const pt=e=>{ const r=cv.getBoundingClientRect(), k=10000/LEC.W; return [rnd((e.clientX-r.left)*k), rnd((e.clientY-r.top)*k), lecNow()]; };
  cv.addEventListener('pointerdown', e=>{
    if(LEC.mode!=='rec') return;
    if(LEC.rec?.state!=='recording'){ toast('●を押してから書いてね', 1500); return; }
    if(e.pointerType==='touch' && state.settings.penSeen) return;   // Pencilがある端末では指はつかわない
    e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch{} id=e.pointerId;
    LEC.cur={k:'s', t:lecNow(), c:LEC.color, w:PEN_W[1], p:pt(e)};
  });
  cv.addEventListener('pointermove', e=>{
    if(e.pointerId!==id || !LEC.cur) return; e.preventDefault();
    const evs=e.getCoalescedEvents?.()||[]; for(const ev of (evs.length?evs:[e])){ const q=pt(ev), p=LEC.cur.p; if(Math.hypot(q[0]-p[p.length-3], q[1]-p[p.length-2])<8) continue; p.push(...q); }
    const ctx=cv.getContext('2d'); lecDraw(); drawItem(ctx, {k:'s', t:'pen', c:LEC.cur.c, w:LEC.cur.w, p:LEC.cur.p.map((v,i)=>i%3===2?50:v)}, cv.width/10000);
  });
  const up=e=>{ if(e.pointerId!==id) return; id=null; if(LEC.cur){ LEC.ev.push(LEC.cur); LEC.cur=null; lecDraw(); } };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  guardStylus($('#lecWrap'));
})();
$('#lecBar').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.c){ LEC.color=b.dataset.c; lecTools(); return; }
  const a=b.dataset.l;
  if(a==='close'){ lecClose(); }
  else if(a==='bg'){ lecSetBg(!LEC.bg); }
  else if(a==='undo'){ if(LEC.rec?.state==='recording') LEC.ev.push({k:'undo', t:lecNow()}); else LEC.ev.pop(); lecDraw(); }
  else if(a==='clear'){ if(LEC.rec?.state==='recording') LEC.ev.push({k:'clear', t:lecNow()}); else LEC.ev=[]; lecDraw(); }
});
$('#lecCtl').addEventListener('click', async e=>{
  const b=e.target.closest('button'); if(!b || LEC.mode!=='rec') return; const a=b.dataset.l;
  if(a==='rec'){ if(LEC.rec?.state==='recording') lecStop(); else lecStart(); }
  else if(a==='redo'){ LEC.audioBlob=null; LEC.ev=[]; LEC.t0=0; lecDraw(); lecTools(); }
  else if(a==='preview'){ lecPlay({title:'確かめ', dur:LEC.dur, a:LEC.a, events:LEC.ev}, URL.createObjectURL(LEC.audioBlob), LEC.bg, true); }
  else if(a==='send'){ await lecSend(); }
});
async function lecSend(){
  const title=await promptDlg('解説の名前（なくてもOK）', `${state.book?.name||''} ${LEC.target.p+1}ページ`.trim());
  if(title===null) return;
  toast('解説を送っています…', 5000);
  try{
    const put=async(buf,mime)=>{ const id=await sha(buf); const r=await api(`api/blob/${id}?name=${encodeURIComponent(mime)}`,{method:'PUT', headers:{'content-type':mime}, body:buf}); if(!r.ok) throw 0; return id; };
    const abuf=await LEC.audioBlob.arrayBuffer(); const mime=(LEC.audioBlob.type||'audio/mp4').split(';')[0];
    const aud=await put(abuf, mime); await store.put('files','aud|'+aud, abuf);
    let bg=null; if(LEC.bgBuf){ bg=await put(LEC.bgBuf,'image/jpeg'); await store.put('files','img|'+bg, LEC.bgBuf); }
    const lid=uid('L'); const data={kind:'lec', id:lid, title:title.slice(0,60), dur:LEC.dur, a:LEC.a, aud, mime, bg, events:LEC.ev, updated:Date.now()};
    const r=await api('api/kv?key='+encodeURIComponent('lec_'+lid),{method:'PUT', headers:{'content-type':'application/json'}, body:JSON.stringify(data)});
    if(!r.ok) throw 0;
    await store.put('ink','lec|'+lid, data);
    const {p, pt}=LEC.target;
    advReplace(p, null, {k:'lec', id:uid('a'), lec:lid, title:data.title, dur:Math.round(LEC.dur/1000), x:rnd(pt.x), y:rnd(pt.y)});
    toast('🎬 解説を送りました', 2000); lecClose(true);
  }catch(err){ console.warn(err); toast('送れませんでした。電波を確かめて、もう一度「送る」を押してください', 5000); }
}
function lecClose(force){
  if(LEC.mode==='rec' && !force && (LEC.ev.length || LEC.rec?.state==='recording')){
    confirmDlg('解説をやめる','録画した内容は送られずに消えます。','やめる',true).then(ok=>{ if(ok) lecClose(true); }); return;
  }
  try{ LEC.rec?.state==='recording' && LEC.rec.stop(); }catch{} clearInterval(LEC.timer);
  try{ LEC.stream?.getTracks().forEach(t=>t.stop()); }catch{}
  if(LEC.play){ LEC.play.audio?.pause(); cancelAnimationFrame(LEC.play.raf); }
  LEC.mode=null; LEC.play=null; $('#lec').classList.add('hidden');
}
