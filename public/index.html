<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>トキノート</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=20261120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="tokinote">
<meta name="theme-color" content="#1f6feb">
<style>
:root{
  --bg:#eef1f5; --card:#fff; --ink:#1d2330; --sub:#5b6474; --line:#d9dee7;
  --accent:#1f6feb; --accent-soft:#e7f0ff; --ok:#e5002d; --tri:#f08c00; --ng:#2f6fe0;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}

/* ===== main ===== */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line);z-index:5}
.ib{min-width:42px;height:42px;border-radius:12px;font-size:20px;display:inline-flex;align-items:center;justify-content:center}
.ib:active,.pill:active{background:#e9edf3}
.ib.on{background:var(--accent-soft);outline:2px solid var(--accent)}
.pill{height:42px;padding:0 12px;border-radius:21px;background:#f1f3f7;font-size:15px;font-weight:600;white-space:nowrap}
.pill b{color:var(--ok)}
#bookTitle{font-weight:700;font-size:15px;max-width:22vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stats{font-size:13px;color:var(--sub);white-space:nowrap}
.sp{flex:1}
#cloud{font-size:12px;color:var(--sub);white-space:nowrap}
@media (max-width:900px){ #btnZoomOut,#btnZoomIn{display:none} #top{flex-wrap:nowrap;gap:3px} #stats{min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto} #top .ib{min-width:38px} #top .pill{padding:0 9px} }
#viewer{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
#pages{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 12px 140px;min-width:100%;width:max-content;box-sizing:border-box}
.page{position:relative;background:#fff;box-shadow:0 1px 4px rgba(20,30,50,.18);flex:none;touch-action:pan-x pan-y}
body.fd .page{touch-action:none}
.page canvas{position:absolute;left:0;top:0;display:block}
#mainArea{flex:1;display:flex;min-height:0;position:relative}
#memo{position:absolute;z-index:5;display:flex;flex-direction:column;background:#fcfdff;border:2px solid #b9c4d4;border-radius:14px;
  box-shadow:0 8px 28px rgba(20,30,50,.25);overflow:hidden}
.mhead{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 10px;background:#eef3fa;border-bottom:1px solid var(--line);font-size:14px;touch-action:none;cursor:move;flex:none}
.mhead .grip{color:#9aa5b5;font-size:16px;letter-spacing:-2px;margin-right:4px}
#memoResize{position:absolute;right:0;bottom:0;width:40px;height:40px;touch-action:none;cursor:nwse-resize;z-index:2;
  display:flex;align-items:flex-end;justify-content:flex-end;padding:3px 5px;color:#5b6f8f;font-size:16px;
  background:linear-gradient(135deg,transparent 52%,rgba(31,111,235,.18) 52%);border-bottom-right-radius:12px}
#memoBody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#memoStage{position:relative;touch-action:pan-x pan-y;
  background-image:linear-gradient(#e6ebf3 1px,transparent 1px),linear-gradient(90deg,#e6ebf3 1px,transparent 1px);background-size:28px 28px}
body.fd #memoStage{touch-action:none}
#memoStage canvas{position:absolute;left:0;top:0;display:block}
#btnMemo.on{background:var(--accent-soft);outline:2px solid var(--accent)}
.page canvas.live{pointer-events:none}
.ov{position:absolute;inset:0;pointer-events:none}
.ov>*{position:absolute;left:calc(var(--x) * var(--u) * 1px);top:calc(var(--y) * var(--u) * 1px);
  width:calc(var(--w) * var(--u) * 1px);height:calc(var(--h) * var(--u) * 1px)}
.pno{position:absolute;right:-2px;bottom:-22px;font-size:12px;color:var(--sub)}
.mask{background:#8f99a8;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;
  font-size:clamp(12px,calc(var(--h) * var(--u) * .5px),28px);transition:background .15s}
.mask::after{content:"？"}
.mask.open{background:transparent;outline:2px dashed rgba(143,153,168,.8)}
.mask.open::after{content:""}
.region{border:2px dashed rgba(31,111,235,.45);border-radius:8px}
.badge{position:absolute;left:-2px;top:-14px;background:#fff;border:1.5px solid rgba(31,111,235,.6);color:var(--accent);
  font-size:12px;font-weight:700;padding:1px 7px;border-radius:10px;white-space:nowrap}
.badge.ng{border-color:var(--ng);color:var(--ng)} .badge.ok{border-color:var(--ok);color:var(--ok)} .badge.grad{border-color:#b8860b;color:#b8860b}
.del{position:absolute;right:-12px;top:-12px;width:28px;height:28px;border-radius:50%;background:#e5002d;color:#fff;font-weight:800;
  font-size:16px;line-height:28px;text-align:center;pointer-events:auto;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.rubber{border:2px dashed var(--accent);background:rgba(31,111,235,.08);border-radius:6px}
.rubber.mask{border-color:#6b7380;background:rgba(107,115,128,.25)}
.loading{padding:60px 20px;color:var(--sub);font-size:16px}

/* tools */
#tools{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;background:var(--card);border-radius:20px;
  box-shadow:0 4px 18px rgba(20,30,50,.18);max-width:calc(100vw - 16px)}
#toolBtns{display:flex;gap:2px;flex-wrap:nowrap}
#toolsMini{display:none}
#tools.min{left:auto;right:calc(12px + env(safe-area-inset-right));transform:none;padding:5px;border-radius:18px}
#tools.min #toolBtns,#tools.min #row2{display:none}
#tools.min #toolsMini{display:flex;outline:2px solid var(--accent);background:var(--accent-soft)}
#row2{display:flex;align-items:center;gap:2px}
@media (min-width:1100px){ #tools{flex-direction:row} #row2{margin-left:6px;border-left:1px solid var(--line);padding-left:6px} }
.tool{width:clamp(30px,calc((100vw - 52px)/13),54px);height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;line-height:1}
.tool small{font-size:10px;white-space:nowrap;color:var(--sub);margin-top:3px}
.tool.on{background:var(--accent-soft);outline:2px solid var(--accent)}
.sep{width:1px;height:38px;background:var(--line);margin:0 4px}
#opts{display:flex;align-items:center;gap:6px;min-height:46px;padding:0 4px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
.sw.pal{background:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;border:0;box-shadow:0 0 0 1.5px var(--line)}
.wd{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.wd i{display:block;background:var(--ink);border-radius:9px;width:22px}
.wd.on{background:var(--accent-soft);outline:2px solid var(--accent)}
.hint{font-size:13px;color:var(--sub);max-width:200px;line-height:1.35}
.ib:disabled{opacity:.3}

/* red sheet */
#redsheet{position:fixed;left:0;right:0;height:38vh;background:#ff0000;mix-blend-mode:multiply;pointer-events:none;z-index:4}
#redgrip{position:fixed;left:50%;transform:translate(-50%,-100%);z-index:7;background:#c4001c;color:#fff;font-weight:700;font-size:14px;
  padding:8px 18px;border-radius:14px 14px 0 0;touch-action:none;cursor:grab}

/* screens */
.screen{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:6px 0 14px}
h2{font-size:18px;margin:22px 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{height:40px;padding:0 16px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-weight:700}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.big{display:block;width:100%;height:58px;border-radius:16px;background:var(--accent);color:#fff;font-size:18px;font-weight:800;margin:14px 0}
.big.sub{background:#fff;color:var(--accent);border:2px solid var(--accent)}
.card{background:#fff;border-radius:var(--r);padding:14px 16px;margin:10px 0;box-shadow:0 1px 3px rgba(20,30,50,.08);display:flex;gap:12px;align-items:center}
.card .t{font-weight:700;font-size:16px;word-break:break-all}
.card .m{font-size:13px;color:var(--sub);margin-top:3px}
.card .grow{flex:1;min-width:0}
.card.ghost{opacity:.6}
.btn{height:42px;padding:0 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;white-space:nowrap}
.btn.sub{background:#f1f3f7;color:var(--ink)}
.btn.red{background:#fdecee;color:#c4001c}
.note{font-size:13px;color:var(--sub);line-height:1.6}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:9px;background:#fdecee;color:#c4001c;margin-left:6px}
.tag.blue{background:var(--accent-soft);color:var(--accent)}

/* review */
#review{display:flex;flex-direction:column;overflow:hidden}
#rvHead{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
#rvBody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#rvStage{position:relative;margin:14px auto 160px;background:#fff;box-shadow:0 1px 4px rgba(20,30,50,.18);touch-action:pan-x pan-y}
body.fd #rvStage{touch-action:none}
#rvStage canvas{position:absolute;left:0;top:0;display:block}
#rvStage .calc{position:absolute;left:0;right:0;border-top:2px dashed var(--line);color:#b0b7c3;font-size:13px;padding:6px 10px;pointer-events:none}
#rvGrade{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px;
  background:#fff;padding:10px;border-radius:22px;box-shadow:0 4px 18px rgba(20,30,50,.2);z-index:3}
.gb{width:84px;height:68px;border-radius:16px;font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f6f7fa}
.gb small{font-size:11px;color:var(--sub);margin-top:2px}
.rvinfo{max-width:900px;margin:12px auto 0;padding:0 16px;font-size:14px;color:var(--sub)}

/* sheet / dialog */
#veil{position:fixed;inset:0;background:rgba(15,20,30,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:#fff;width:min(560px,100%);border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
#sheet h3{margin:0 0 12px;font-size:18px}
#sheet p{margin:0 0 14px;line-height:1.6;font-size:15px}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;padding:10px 12px;border-radius:12px;text-align:left;font-size:16px}
.opt:active{background:#f1f3f7}
.opt + .opt{border-top:1px solid #eef0f4}
.opt .s{font-size:13px;color:var(--sub)}
.sw2{width:50px;height:30px;border-radius:15px;background:#cfd5de;position:relative;flex:none}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw2.on{background:#34c759} .sw2.on::after{left:23px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .btn{height:56px;font-size:16px}
input.txt{width:100%;height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:18px;margin-bottom:14px;-webkit-user-select:text;user-select:text}
#login{display:flex;align-items:center;justify-content:center;background:#f3f6fb}
.pinbox{text-align:center;padding:24px;max-width:420px;width:100%}
#pinDots{display:flex;gap:16px;justify-content:center;margin:6px 0 10px}
#pinDots span{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent)}
#pinDots span.on{background:var(--accent)}
#pinMsg{min-height:24px;color:#c4001c;font-size:14px;margin-bottom:10px}
.keys{display:grid;grid-template-columns:repeat(3,84px);gap:14px;justify-content:center}
.keys button{width:84px;height:84px;border-radius:50%;background:#fff;font-size:30px;font-weight:600;box-shadow:0 1px 4px rgba(20,30,50,.15)}
.keys button:active{background:var(--accent-soft)}
#viewBar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:#fff6db;border-bottom:1px solid #f0d78c;font-size:15px}
#qBar{position:fixed;left:0;right:0;top:0;z-index:900;padding-top:max(8px,env(safe-area-inset-top));box-shadow:0 2px 8px rgba(0,0,0,.15);display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:#ffe7ea;border-bottom:1px solid #f5b5c0;font-size:15px}
#qBar.hidden{display:none}
.btn.sub.on{background:var(--accent-soft);outline:2px solid var(--accent);color:var(--accent)}
@media (max-width:900px){ #btnAsk .lbl{display:none} }
#ansPanel{position:fixed;z-index:800;background:#fff;box-shadow:0 0 18px rgba(0,0,0,.25);display:flex;flex-direction:column}
#ansPanel[data-side=right]{top:60px;right:0;bottom:var(--ansb,90px);border-bottom-left-radius:10px;width:min(46vw,620px);border-left:3px solid #1f6feb}
#ansPanel[data-side=bottom]{left:0;right:0;bottom:var(--ansb,90px);height:42vh;border-top:3px solid #1f6feb}
#ansPanel.hidden{display:none}
#ansPanel .ansHead{display:flex;align-items:center;gap:2px;padding:4px 6px;background:#eaf2ff;flex-wrap:wrap;font-size:14px}
#ansPanel .ansHead .s{font-size:11px;color:var(--sub)}
#ansPanel .ansHead .ib{width:34px;height:34px;font-size:15px}
#ansBody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px;background:#f4f6f9}
#ansBody canvas{display:block;box-shadow:0 1px 4px rgba(0,0,0,.2)}
body.ansOpen #btnAns{background:#dbe8ff}
body.hasQ #app,body.hasQ .screen{top:var(--qh,52px)}
#viewFollow.on{background:var(--accent);color:#fff}
#advTools{display:none;position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;
  align-items:center;gap:2px;padding:6px 8px;background:#fff;border-radius:20px;box-shadow:0 4px 18px rgba(20,30,50,.18);max-width:calc(100vw - 16px);flex-wrap:wrap;justify-content:center;border:2px solid #0a9b5c}
body.viewing #advTools{display:flex}
.advlabel{font-size:12px;font-weight:800;color:#0a9b5c;padding:0 6px}
.ov>.advtx{height:auto;font-size:calc(var(--fs) * var(--u) * 1px);color:var(--c);background:rgba(255,255,255,.9);border:2px solid var(--c);
  border-radius:10px;padding:.25em .45em;font-weight:700;line-height:1.4;white-space:pre-wrap;word-break:break-all;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.ov>.advtx::before{content:"💬 ";font-size:.8em}
.ov>.advau{width:auto;height:auto;pointer-events:auto;display:flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;border-radius:24px;
  background:#0a9b5c;color:#fff;font-weight:800;font-size:17px;box-shadow:0 3px 10px rgba(0,0,0,.25);cursor:pointer;transform:translate(-50%,-50%);touch-action:manipulation}
.ov>.advau .ic{font-size:20px}
.ov>.advau.lecb{background:#7c3aed}
.ov>.advau.vidb{background:#0f172a}
.recbtn.play{border-color:var(--accent);color:var(--accent);font-size:30px;width:72px;height:72px}
#lec.hidden{display:none!important}
#lecWrap{overflow:hidden;position:relative}
#lecStage{will-change:transform}
#lecBar{gap:6px!important}
#lecBar .lecTools{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
#lecBar .tool{width:52px;padding:4px 0}
#lecBar .wbtn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px}
#lecBar .wbtn span{display:block;width:20px;background:#1d2330;border-radius:4px}
#lecBar .wbtn.on{background:var(--accent-soft);outline:2px solid var(--accent)}
#lecSel{position:absolute;border:2px dashed #1f6feb;background:rgba(31,111,235,.06);border-radius:6px;cursor:move;touch-action:none;z-index:3}
#lecSel .lsH{position:absolute;right:-12px;bottom:-12px;width:24px;height:24px;border-radius:50%;background:#1f6feb;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:nwse-resize}
#lecSel .lsbar{position:absolute;left:0;top:-46px;display:flex;gap:4px;transform-origin:0 100%;white-space:nowrap}
#lecSel .lsbar button{background:#fff;border-radius:10px;padding:6px 10px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.25);font-size:14px}
.ov>.advau.new{animation:aupulse 1.4s ease-in-out infinite}
.ov>.advau.new::after{content:"NEW";font-size:10px;background:#ffd23f;color:#5a4300;border-radius:8px;padding:1px 5px;margin-left:2px}
.ov>.advau.play{background:#e11d48}
@keyframes aupulse{0%,100%{box-shadow:0 0 0 0 rgba(10,155,92,.55)}50%{box-shadow:0 0 0 12px rgba(10,155,92,0)}}
.recbtn{width:96px;height:96px;border-radius:50%;background:#fff;border:6px solid #e11d48;color:#e11d48;font-size:40px;font-weight:900}
.recbtn.on{background:#e11d48;color:#fff;animation:aupulse 1.2s infinite}
.ov>.advimg{border:3px solid #0a9b5c;border-radius:8px;background:#fff;object-fit:contain;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.ov>.mytx{background:rgba(255,255,255,.75);border:1.5px dashed var(--c);box-shadow:none}
.ov>.mytx::before{content:""}
.ov>.selBox{border:2px dashed #1f6feb;border-radius:10px;pointer-events:auto;touch-action:none;background:rgba(31,111,235,.05);cursor:move}
.selBar{position:absolute;left:50%;top:-50px;transform:translateX(-50%);display:flex;gap:4px;background:#fff;border-radius:14px;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.2);white-space:nowrap}
.selBar button{height:36px;padding:0 12px;border-radius:10px;background:#f1f3f7;font-weight:700;font-size:14px}
.selH{position:absolute;right:-16px;bottom:-16px;width:32px;height:32px;border-radius:50%;background:#1f6feb;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:nwse-resize;touch-action:none}
.reactBig{position:fixed;left:50%;top:42%;z-index:80;pointer-events:none;text-align:center;transform:translate(-50%,-50%)}
.reactBig .re{font-size:120px;line-height:1.1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.25))}
.reactBig .rt{font-size:34px;font-weight:900;color:#fff;background:rgba(229,0,45,.92);padding:6px 22px;border-radius:30px;margin-top:6px;white-space:nowrap}
.ov>.pingRing{width:0;height:0}
.ov>.pingRing::before,.ov>.pingRing::after{content:"";position:absolute;left:-40px;top:-40px;width:80px;height:80px;border-radius:50%;border:6px solid #ff3b30;animation:ping 1.3s ease-out 3}
.ov>.pingRing::after{animation-delay:.4s}
@keyframes ping{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.8);opacity:0}}
#btnAdv.on{background:#e7f7ef;outline:2px solid #0a9b5c}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(10,15,25,.9);display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:96vw;max-height:92vh;border-radius:8px;background:#fff}
.lightbox .ib{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:#fff}
body.viewing #tools, body.viewing #btnReview, body.viewing #btnCoin, body.viewing #btnMore, body.viewing #memoClear{display:none!important}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(25,30,40,.92);color:#fff;
  padding:12px 18px;border-radius:14px;font-size:15px;z-index:60;max-width:90vw;text-align:center;line-height:1.5;pointer-events:none;transition:opacity .2s;opacity:0}
#toast.show{opacity:1}
.cf{position:fixed;width:10px;height:14px;border-radius:2px;z-index:55;pointer-events:none}
.bigstamp{position:fixed;z-index:56;pointer-events:none;font-size:90px;font-weight:900}
</style>

<script type="module">
import * as pdfjsLib from './vendor/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = new URL('./vendor/pdf.worker.min.mjs', location.href).href;
// cMap（日本語PDFの文字対応表）は cmaps.json に同梱し、必要な時だけ読む
let cmapsP=null;
const b64u8 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
class BundledCMapFactory{
  constructor(){}
  async fetch({name}){
    cmapsP ||= fetch(new URL('./cmaps.json', location.href)).then(r=>r.json()).catch(e=>{ cmapsP=null; throw e; });
    const all=await cmapsP; if(!all[name]) throw new Error('CMap not found: '+name);
    return {cMapData:b64u8(all[name]), isCompressed:true};
  }
}
const PDF_OPTS = {cMapUrl:'bundled/', cMapPacked:true, CMapReaderFactory:BundledCMapFactory, useWorkerFetch:false, isEvalSupported:false, useSystemFonts:true};

/* ================= constants ================= */
const $ = s => document.querySelector(s);
const DAY = 86400000;
const INTERVALS = [3, 7, 30];          // ○のあと、次に出す日数。全部○で卒業
const PEN_W = [18, 30, 52];            // 太さ（ページ幅=10000）
const MK_W = [150, 230, 330];
const ERASE_R = 140;
const STAMP_S = 650;
const PEN_COLORS = [['#1d2330','くろ'],['#6b7280','はいいろ'],['#1e3a8a','こん'],['#1f5fd6','あお'],['#0ea5e9','みずいろ'],['#0f9488','あおみどり'],
  ['#12a150','みどり'],['#65a30d','きみどり'],['#ff5a00','赤シート用'],['#e11d48','あか'],['#db2777','ピンク'],['#c026d3','むらさきピンク'],
  ['#7c3aed','むらさき'],['#92400e','ちゃいろ'],['#b8860b','きんいろ'],['#ffffff','しろ（けす代わり）']];
const MK_COLORS = [['#ffe14d','きいろ'],['#ffb35c','オレンジ'],['#ff7a7a','あか'],['#ff8fc2','ピンク'],['#e9a3ff','むらさき'],
  ['#a5b4ff','あお'],['#7fd8ff','みずいろ'],['#7ee8c8','ミント'],['#b8f25c','きみどり'],['#c7ccd4','はいいろ']];
const RED_SHEET_HEX='#ff5a00';
const colorName = (list, hex) => (list.find(x=>x[0].toLowerCase()===hex.toLowerCase())||[])[1] || 'じぶんの色';
const STAMP_C = {o:'#e5002d', t:'#f08c00', x:'#2f6fe0'};
const STAMP_ICON = {o:'⭕', t:'🔺', x:'❌'};
const REASONS = ['計算ミス','読みまちがい','知らなかった','時間切れ'];
const TOOLS = [['hand','✋','見る'],['pen','✏️','ペン'],['marker','🖍️','マーカー'],['eraser','🧽','消す'],
  ['o','⭕','まる'],['t','🔺','おしい'],['x','❌','ばつ'],['region','🔲','問題わく'],['mask','⬛','穴うめ'],['gap','↕️','すきま'],['sticker','🌟','スタンプ'],['lasso','➰','かこむ'],['text','🔤','文字']];
const STORES = ['files','books','shared','learn','ink','meta'];

const state = {
  learners:[{id:'k1',name:'子ども1'},{id:'k2',name:'子ども2'}], learner:'k1',
  settings:{fingerDraw:true, penSeen:false, sound:true, pin:'', toolsHidden:false, memoBox:null,
    pen:'#1d2330', mk:'#ffe14d', penRecent:['#1d2330','#1f5fd6','#ff5a00','#e11d48'], mkRecent:['#ffe14d','#ff8fc2','#7fd8ff','#b8f25c']},
  tool:'pen', penW:1, mkW:1,
  book:null, pdf:null, pdfId:null, shared:null, ink:new Map(), pages:[], zoom:1,
  revealed:new Set(), revealAll:false, red:false, redTop:0,
  learnAll:new Map(), sharedAll:new Map(), stats:{days:{},updated:0},
  screen:'lib', lastAct:Date.now(), curPage:0,
  adv:new Map(), advHidden:false, advTool:'hand', advColor:'#0a9b5c', pendingImg:null
};

/* ================= utils ================= */
const uid = (p='') => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
const rnd = v => Math.round(v);
const dateKey = (t=Date.now()) => { const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const endOfDay = (t=Date.now()) => { const d=new Date(t); d.setHours(23,59,59,999); return d.getTime(); };
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const withTimeout = (p, ms) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}), ms))]);
const timers = new Map(), timerFns = new Map();
// アプリを閉じる・切りかえるときは、待っている保存をすぐ実行する
function flushDebounced(){ for(const [k,t] of timers){ clearTimeout(t); const f=timerFns.get(k); timers.delete(k); try{ f?.(); }catch{} } try{ Cloud.flush(); }catch{} }
addEventListener('pagehide', flushDebounced);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushDebounced(); });
function debounce(key, fn, ms){ timerFns.set(key, fn); clearTimeout(timers.get(key)); timers.set(key, setTimeout(()=>{ timers.delete(key); fn(); }, ms)); }
let toastT;
function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), ms); }

/* ================= local storage (IndexedDB) ================= */
let mem = null, dbp = null;
const req = r => new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const done = t => new Promise((res,rej)=>{ t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); });
function openDB(){
  if(!dbp) dbp = new Promise((res,rej)=>{
    let r; try{ r = indexedDB.open('tokinote', 1); }catch(e){ rej(e); return; }
    r.onupgradeneeded = () => { const d=r.result; for(const s of STORES) if(!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
  });
  return dbp;
}
const store = {
  async get(s,k){ if(mem) return mem[s].get(k); const d=await openDB(); return req(d.transaction(s).objectStore(s).get(k)); },
  async put(s,k,v){ if(mem){ mem[s].set(k,v); return; } const d=await openDB(); const t=d.transaction(s,'readwrite'); t.objectStore(s).put(v,k); await done(t); },
  async del(s,k){ if(mem){ mem[s].delete(k); return; } const d=await openDB(); const t=d.transaction(s,'readwrite'); t.objectStore(s).delete(k); await done(t); },
  async range(s,prefix){
    if(mem) return [...mem[s]].filter(([k])=>String(k).startsWith(prefix));
    const d=await openDB(); const os=d.transaction(s).objectStore(s);
    const kr = IDBKeyRange.bound(prefix, prefix+'￿');
    const [ks,vs] = await Promise.all([req(os.getAllKeys(kr)), req(os.getAll(kr))]);
    return ks.map((k,i)=>[k,vs[i]]);
  },
  all(s){ return this.range(s,''); },
  // 中身を読まずに名前だけ（PDFや動画が大きくても軽い）
  async keys(s){ if(mem) return [...mem[s].keys()]; const d=await openDB(); return req(d.transaction(s).objectStore(s).getAllKeys()); }
};
async function initStore(){
  try{ await withTimeout(openDB(), 5000); }
  catch(e){ mem={}; for(const s of STORES) mem[s]=new Map(); toast('この画面では端末に保存できません。閉じると書き込みが消えます', 7000); }
  try{ await navigator.storage?.persist?.(); }catch{}
}

/* ================= cloud ================= */
// 2つの保存先に対応：
//  'cf'     … 自分のCloudflare Worker（/api/*）。パスコードでログインし、見守り（リアルタイム）も使える
//  'claude' … claude.ai アーティファクトのDB（ログイン中ユーザーの非公開領域）
const api = (path, opt={}) => fetch(path, {credentials:'same-origin', cache:'no-store', ...opt});
const Cloud = {
  mode:null, db:null, base:'', st:'connecting', q:new Map(), busy:new Set(), timer:null, warned:{},
  async init(){
    // まず Cloudflare 版かどうかを確かめる（claude.ai の中ではこの通信は止められる）
    try{
      const r = await withTimeout(api('api/health'), 6000);
      if(r.ok){ const j=await r.json(); if(j.app==='tokinote'){
        if(!j.configured){ await showSetupNeeded(); return; }
        if(!j.authed) await showLogin();
        this.mode='cf'; this.db=true; this.set('on'); Live.connect(); return; } }
    }catch{}
    try{
      if(!window.claude || typeof window.claude.use !== 'function'){ this.set('off'); return; }
      const [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if(!db || !user){ this.set('off'); return; }
      const id = await user.id(); if(!id){ this.set('off'); return; }
      this.mode='claude'; this.db = db; this.base = 'data/users/' + id; this.set('on');
    }catch(e){ this.set('off'); }
  },
  set(s){ this.st=s; renderCloud(); },
  doc(path){ return this.db.doc(this.base + '/' + path); },
  put(path, body, force){ if(!this.db || (state.viewOnly && !force)) return; this.q.set(path, body); clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(), this.mode==='cf'?800:2000); },
  async write(path, body){
    if(this.mode==='cf'){
      const r = await api('api/kv?key='+encodeURIComponent(path), {method:'PUT', headers:{'content-type':'application/json'}, body:JSON.stringify(body)});
      if(r.status===401){ throw {code:'auth'}; }
      if(r.status===413) throw {code:'invalid_argument'};
      if(!r.ok) throw {code:'unavailable'};
      return;
    }
    return this.doc(path).set(body);
  },
  async flush(){
    if(!this.db) return;
    for(const [path,body] of [...this.q]){
      if(this.busy.has(path)) continue;
      this.q.delete(path); this.busy.add(path); this.set('saving');
      try{ await this.write(path, body); }
      catch(e){
        const c = e?.code;
        if(c==='invalid_argument'){ if(!this.warned.big){ this.warned.big=1; toast('書き込みがとても多いページはクラウドに保存できませんでした（この端末には保存済み）', 6000);} }
        else if(c==='quota_exceeded'){ if(!this.warned.q){ this.warned.q=1; toast('クラウドの保存容量がいっぱいです（この端末には保存済み）', 6000);} }
        else if(c==='auth'){ if(!this.q.has(path)) this.q.set(path, body); this.busy.delete(path); await showLogin(); }
        else if(['revoked','not_granted','capability_disabled','capability_removed'].includes(c)){ this.db=null; this.set('off'); return; }
        else if(!this.q.has(path)) this.q.set(path, body);
      }finally{ this.busy.delete(path); }
    }
    if(this.q.size){ clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(), 4000); } else this.set('on');
  },
  async get(path){
    if(!this.db) return null;
    try{
      if(this.mode==='cf'){ const r=await withTimeout(api('api/kv?key='+encodeURIComponent(path)), 10000); return r.ok ? await r.json() : null; }
      const s=await withTimeout(this.doc(path).get(), 10000); return s.exists ? clone(s.data()) : null;
    }catch{ return null; }
  },
  async list(colPath, where){
    if(!this.db) return [];
    try{
      if(this.mode==='cf'){
        const q=new URLSearchParams({col:colPath||''}); if(where){ q.set('field',where[0]); q.set('value',where[2]); }
        const r=await withTimeout(api('api/kv/list?'+q), 15000); return r.ok ? await r.json() : [];
      }
      let q = this.db.collection(this.base + (colPath ? '/'+colPath : '')); if(where) q = q.where(...where);
      const s = await withTimeout(q.get(), 10000); return s.docs.map(d=>({id:d.id, data:clone(d.data())}));
    }catch{ return []; }
  },
  // PDF本体（Cloudflare版だけ）
  async hasPdf(id){ if(this.mode!=='cf') return false; try{ const r=await api('api/pdf/'+id, {method:'HEAD'}); return r.ok; }catch{ return false; } },
  async uploadPdf(id, buf, name){
    if(this.mode!=='cf') return false;
    if(await this.hasPdf(id)) return true;
    try{ const r=await api(`api/pdf/${id}?name=${encodeURIComponent(name||'')}`, {method:'PUT', headers:{'content-type':'application/pdf'}, body:buf});
      if(r.status===413){ toast('PDFが大きすぎてクラウドに置けませんでした（95MBまで）。この端末では使えます', 6000); return false; }
      return r.ok; }catch{ return false; }
  },
  async downloadPdf(id){
    if(this.mode!=='cf') return null;
    try{ const r=await api('api/pdf/'+id); return r.ok ? await r.arrayBuffer() : null; }catch{ return null; }
  }
};

/* ================= Live（見守り：Cloudflare版だけ） ================= */
const Live = {
  ws:null, open:false, retry:0, lastSend:0, pending:null, timer:null, onMsg:null,
  connect(){
    if(Cloud.mode!=='cf') return;
    try{
      const u=new URL('api/live', location.href); u.protocol = u.protocol==='https:'?'wss:':'ws:';
      const ws=new WebSocket(u); this.ws=ws;
      ws.onopen=()=>{ this.open=true; this.retry=0; if(state.viewOnly) this.send({t:'hello'}); else sendCur(); };
      ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch{ return; } onLiveMsg(m); };
      ws.onclose=()=>{ this.open=false; this.ws=null; const d=Math.min(30000, 1000*2**this.retry++); setTimeout(()=>this.connect(), d); };
      ws.onerror=()=>{ try{ ws.close(); }catch{} };
    }catch{}
  },
  send(m){ if(this.open && this.ws?.readyState===1){ try{ this.ws.send(JSON.stringify(m)); }catch{} } },
  // 書いている途中の線は、0.08秒に1回だけ送る
  // 書き終えたら、まだ送っていない「途中の線」を捨て、終わりの合図を送る（遅れて届いた途中の線が残るのを防ぐ）
  endLive(info){
    clearTimeout(this.timer); this.timer=null; this.pending=null;
    if(info && this.open && (!state.viewOnly || info.area==='adv' || info.area==='amemo')) this.send({t:'liveEnd', L:state.learner, b:state.book?.id, ...info});
  },
  sendLive(m){

/* ---- merges ---- */
function mergeLearn(a, b){
  if(!a) return clone(b); if(!b) return a;
  const out = {marks:{}, lastPage: (b.updated>a.updated? b.lastPage : a.lastPage) ?? 0, updated: Math.max(a.updated||0, b.updated||0)};
  const ids = new Set([...Object.keys(a.marks||{}), ...Object.keys(b.marks||{})]);
  for(const id of ids){
    const map = new Map();
    for(const m of [...(a.marks?.[id]||[]), ...(b.marks?.[id]||[])]){
      const k = m.d+'|'+m.m; const prev = map.get(k);
      if(!prev) map.set(k, {...m}); else if(!prev.r && m.r) prev.r = m.r;
    }
    out.marks[id] = [...map.values()].sort((x,y)=>x.d-y.d);
  }
  const aw=new Map(); for(const x of [...(a.awards||[]), ...(b.awards||[])]) aw.set(x.id, x); if(aw.size) out.awards=[...aw.values()];
  return out;
}
const sameLearn = (a,b) => JSON.stringify(a?.marks||{})===JSON.stringify(b?.marks||{}) && (a?.lastPage||0)===(b?.lastPage||0) && (a?.awards||[]).length===(b?.awards||[]).length;
function mergeStats(a,b){
  const out={days:{...(a?.days||{})}, updated:Math.max(a?.updated||0,b?.updated||0)};
  for(const [d,v] of Object.entries(b?.days||{})){ const o=out.days[d]||{}; out.days[d]={o:Math.max(o.o||0,v.o||0),t:Math.max(o.t||0,v.t||0),x:Math.max(o.x||0,v.x||0),sec:Math.max(o.sec||0,v.sec||0)}; }
  return out;
}

/* ================= SRS (復習) ================= */
function srsOf(marks){
  let st='new', box=0, due=0, last=null;
  for(const m of [...(marks||[])].sort((a,b)=>a.d-b.d)){
    last=m;
    if(m.m==='o'){
      if(st==='new') st='ok';
      else if(st==='review'){ box++; if(box>INTERVALS.length) st='grad'; else due = m.d + INTERVALS[box-1]*DAY; }
    } else { st='review'; box=0; due=m.d; }
  }
  return {st, box, due, last, left: st==='review' ? INTERVALS.length+1-box : 0};
}
function reviewItems(){
  const items=[]; const eod=endOfDay();
  for(const [b,l] of state.learnAll){
    const sh = state.sharedAll.get(b);
    for(const [pid, marks] of Object.entries(l.marks||{})){
      if(!marks.length) continue;
      let prob=null, page=null;
      if(pid.startsWith('pg')) page=+pid.slice(2);
      else { prob = sh?.problems?.find(q=>q.id===pid); if(!prob) continue; page=prob.p; }
      const s = srsOf(marks);
      items.push({b, pid, prob, page, s, isDue: s.st==='review' && s.due<=eod, book: sh?.name || '問題集'});
    }
  }
  return items;
}
function refreshDue(){
  const n = reviewItems().filter(i=>i.isDue).length;
  $('#dueCount').textContent = n; $('#libDue').textContent = n ? `（${n}問）` : '';
}
function problemStatus(b, pid){
  const s = srsOf(getLearn(b).marks[pid]);
  if(s.st==='new') return {cls:'', icon:''};
  if(s.st==='ok') return {cls:'ok', icon:'⭕'};
  if(s.st==='grad') return {cls:'grad', icon:'🏆'};
  return {cls:'ng', icon: s.last?.m==='o' ? '🔁' : s.last?.m==='t' ? '🔺' : '❌'};
}

}

/* ================= drawing ================= */
const bboxCache = new WeakMap();
function bbox(it){
  let b=bboxCache.get(it); if(b) return b;
  const p=it.p; let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(let i=0;i<p.length;i+=3){ x0=Math.min(x0,p[i]); x1=Math.max(x1,p[i]); y0=Math.min(y0,p[i+1]); y1=Math.max(y1,p[i+1]); }
  b={x0,y0,x1,y1}; bboxCache.set(it,b); return b;
}
function drawItem(ctx, it, s){
  if(it.k==='s'){
    const p=it.p; ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle=it.c; ctx.fillStyle=it.c;
    if(it.t==='mk'){
      ctx.globalAlpha=.38; ctx.lineWidth=it.w*s; ctx.beginPath(); ctx.moveTo(p[0]*s,p[1]*s);
      if(p.length===3) ctx.lineTo(p[0]*s+.5,p[1]*s); for(let i=3;i<p.length;i+=3) ctx.lineTo(p[i]*s,p[i+1]*s); ctx.stroke();
    } else {
      if(p.length===3){ ctx.beginPath(); ctx.arc(p[0]*s,p[1]*s,it.w*s*.5,0,Math.PI*2); ctx.fill(); }
      for(let i=3;i<p.length;i+=3){
        const pr=(p[i+2]+p[i-1])/200; ctx.lineWidth=Math.max(.6, it.w*s*(.45+pr*1.1));
        ctx.beginPath(); ctx.moveTo(p[i-3]*s,p[i-2]*s); ctx.lineTo(p[i]*s,p[i+1]*s); ctx.stroke();
      }
    }
    ctx.restore();
  } else if(it.k==='m'){
    const x=it.x*s, y=it.y*s, r=it.s*s/2; ctx.save(); ctx.strokeStyle=STAMP_C[it.m]; ctx.lineWidth=r*.17; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    if(it.m==='o') ctx.arc(x,y,r*.82,0,Math.PI*2);
    else if(it.m==='t'){ ctx.moveTo(x,y-r*.8); ctx.lineTo(x+r*.85,y+r*.65); ctx.lineTo(x-r*.85,y+r*.65); ctx.closePath(); }
    else { ctx.moveTo(x-r*.7,y-r*.7); ctx.lineTo(x+r*.7,y+r*.7); ctx.moveTo(x+r*.7,y-r*.7); ctx.lineTo(x-r*.7,y+r*.7); }
    ctx.stroke(); ctx.restore();
  } else if(it.k==='st') drawSticker(ctx, it, s);
}
function drawAll(cv, items, s){ const ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height); s ??= cv.width/10000; for(const it of items) drawItem(ctx,it,s); }
function segDist2(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay; const l=dx*dx+dy*dy; let t=l?((px-ax)*dx+(py-ay)*dy)/l:0; t=Math.max(0,Math.min(1,t)); const x=ax+t*dx-px, y=ay+t*dy-py; return x*x+y*y; }
function hitStroke(it, pt, rad){
  const b=bbox(it); const R=rad+it.w/2;
  if(pt.x<b.x0-R||pt.x>b.x1+R||pt.y<b.y0-R||pt.y>b.y1+R) return false;
  const p=it.p, R2=R*R;
  if(p.length===3) return (p[0]-pt.x)**2+(p[1]-pt.y)**2<R2;
  for(let i=3;i<p.length;i+=3) if(segDist2(pt.x,pt.y,p[i-3],p[i-2],p[i],p[i+1])<R2) return true;
  return false;
}

function pushUndo(op, which){ const [u,r] = which==='rv' ? [undoRv,redoRv] : [undoMain,redoMain]; u.push(op); if(u.length>300) u.shift(); r.length=0; updUndo(); }
function doUndo(){ const [u,r]=stacks(); const op=u.pop(); if(!op) return; op.undo(); r.push(op); updUndo(); }
function doRedo(){ const [u,r]=stacks(); const op=r.pop(); if(!op) return; op.redo(); u.push(op); updUndo(); }

    const pid=near.pid; let saved=null, idx=-1;
    const redo=()=>{ const j=getInk(p).items.indexOf(near); if(j>=0) getInk(p).items.splice(j,1);
      const arr=learn.marks[pid]||[]; idx=arr.findIndex(x=>x.sid===near.id); if(idx>=0){ saved=arr[idx]; arr.splice(idx,1); bumpStat(saved.d, saved.m, -1); }

    const undo=()=>{ getInk(p).items.push(near); if(saved){ (learn.marks[pid] ||= []).push(saved); bumpStat(saved.d, saved.m, +1); }

function rotatePages(list){
  if(!state.book) return; const b=state.book.id, sh=state.shared;
  const before=clone(sh.rot||{});
  const apply=(r)=>{ sh.rot=r; saveShared(b); relayout(); };
  const skip=list.filter(p=>(state.ink.get(p)?.gaps||[]).length); list=list.filter(p=>!skip.includes(p));
  if(skip.length) toast(`すきまのあるページ（${skip.length}ページ）は回転しませんでした`, 3000); if(!list.length) return;
  const after={...before}; for(const p of list){ after[p]=(((after[p]||0)+90)%360); if(!after[p]) delete after[p]; }
  apply(clone(after)); pushUndo({undo:()=>apply(clone(before)), redo:()=>apply(clone(after))});
}

// 画面上の点(sx,sy)の下にある場所を、拡大後も同じ位置に保つ
function zoomAround(z, sx, sy){
  if(!state.book) return; z=Math.max(ZMIN, Math.min(ZMAX, Math.round(z*100)/100));
  const v=$('#viewer'); const r=v.getBoundingClientRect();
  const cx=v.scrollLeft+sx-r.left, cy=v.scrollTop+sy-r.top;
  let pg=state.pages.find(q=>q.el.offsetTop+q.h>=cy) || state.pages[state.pages.length-1];
  const fx=(cx-pg.el.offsetLeft)/pg.w, fy=(cy-pg.el.offsetTop)/pg.h;
  state.zoom=z; state.pages.forEach(unrenderPage); layoutPages();
  v.scrollTop = pg.el.offsetTop + fy*pg.h - (sy-r.top);
  v.scrollLeft = pg.el.offsetLeft + fx*pg.w - (sx-r.left);
  io.disconnect(); state.pages.forEach(x=>io.observe(x.el));
  store.put('meta','zoom',z).catch(()=>{});

/* ピンチで拡大・縮小（2本指）。指を離すと、その倍率できれいに描き直す */
(()=>{
  const v=$('#viewer'), pages=$('#pages'); let pin=null;
  const fingers = e => [...e.touches].filter(t=>t.touchType!=='stylus');
  const dist = t => Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const midp = t => ({x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2});
  v.addEventListener('touchstart', e=>{
    const t=fingers(e); if(t.length!==2 || !state.book) return;
    e.preventDefault(); abortCur();
    const m=midp(t), r=v.getBoundingClientRect();
    pin={d0:dist(t), m0:m, m, s:1, ox:v.scrollLeft+m.x-r.left, oy:v.scrollTop+m.y-r.top};
    pages.style.transformOrigin=`${pin.ox}px ${pin.oy}px`;
  }, {passive:false});
  v.addEventListener('touchmove', e=>{
    if(!pin) return; const t=fingers(e); if(t.length<2) return; e.preventDefault();
    pin.m=midp(t); pin.s=Math.max(ZMIN/state.zoom, Math.min(ZMAX/state.zoom, dist(t)/pin.d0));
    pages.style.transform=`translate(${pin.m.x-pin.m0.x}px,${pin.m.y-pin.m0.y}px) scale(${pin.s})`;
  }, {passive:false});
  const end = e=>{
    if(!pin || fingers(e).length>=2) return; const p=pin; pin=null;
    pages.style.transform=''; pages.style.transformOrigin='';
    const r=v.getBoundingClientRect();
    if(Math.abs(p.s-1)<0.03){ v.scrollLeft-= (p.m.x-p.m0.x); v.scrollTop-=(p.m.y-p.m0.y); return; }
    // ピンチ開始時の点を、指を離した位置に合わせる
    v.scrollLeft = p.ox - (p.m0.x - r.left); v.scrollTop = p.oy - (p.m0.y - r.top);
    zoomAround(state.zoom*p.s, p.m0.x, p.m0.y);
    v.scrollLeft -= (p.m.x-p.m0.x); v.scrollTop -= (p.m.y-p.m0.y);
  };
  v.addEventListener('touchend', end); v.addEventListener('touchcancel', end);
  document.addEventListener('gesturestart', e=>e.preventDefault());
})();

async function sha(buf){ const h=await crypto.subtle.digest('SHA-256', buf); return [...new Uint8Array(h)].slice(0,10).map(x=>x.toString(16).padStart(2,'0')).join(''); }
$('#filePdf').onchange=async e=>{
  const files=[...e.target.files]; e.target.value=''; let last=null;
  for(const f of files){
    try{
      toast(`「${f.name}」を読み込み中…`, 8000);
      const buf=await f.arrayBuffer(); const id=await sha(buf);
      const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0)), ...PDF_OPTS}).promise;
      const aspects=[]; for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i); const vp=pg.getViewport({scale:1}); aspects.push(vp.height/vp.width); }
      const name=f.name.replace(/\.pdf$/i,'');
      const exist=await store.get('books', id);
      await store.put('files', id, buf);
      await store.put('books', id, {...(exist||{}), id, name: exist?.name || name, pages:pdf.numPages, aspects, added: exist?.added || Date.now(), lastOpened:Date.now()});
      pdf.destroy();
      const sh=getShared(id); if(!sh.name){ sh.name=name; sh.pages=aspects.length; saveShared(id); }
      pushBookToCloud(id, buf);
      last=id;
    }catch(err){ console.warn(err); toast(`「${f.name}」は開けませんでした（パスワード付きや壊れたPDFの可能性）`, 5000); }
  }

async function ensureLocalBook(id){
  let meta=await store.get('books', id), file=await store.get('files', id);
  if(meta && file) return true;
  if(Cloud.mode!=='cf') return false;
  toast('クラウドからPDFを取り寄せています…', 20000);
  const buf=await Cloud.downloadPdf(id); if(!buf){ toast('クラウドにこのPDFがありません'); return false; }
  try{
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0)), ...PDF_OPTS}).promise;
    const aspects=[]; for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i); const vp=pg.getViewport({scale:1}); aspects.push(vp.height/vp.width); }
    pdf.destroy();
    const cb=await Cloud.get(`bk_${id}`);
    const name=cb?.name || getShared(id).name || 'PDF';
    await store.put('files', id, buf);
    await store.put('books', id, {...(meta||{}), id, name, pages:aspects.length, aspects, added:Date.now(), lastOpened:Date.now()});
    toast('取り寄せました', 1200); return true;
  }catch(e){ console.warn(e); toast('PDFを開けませんでした'); return false; }
}

function dragHandle(el, onMove){
  let st=null;
  el.addEventListener('pointerdown', e=>{
    if(e.target.closest('button')) return;
    e.preventDefault(); e.stopPropagation(); try{ el.setPointerCapture(e.pointerId); }catch{}
    st={id:e.pointerId, x:e.clientX, y:e.clientY, b:memoBox()};
  });
  el.addEventListener('pointermove', e=>{ if(!st||e.pointerId!==st.id) return; e.preventDefault(); placeMemo(onMove(st.b, e.clientX-st.x, e.clientY-st.y)); });
  const end=e=>{ if(!st||e.pointerId!==st.id) return; const b=onMove(st.b, e.clientX-st.x, e.clientY-st.y); st=null; state.settings.memoBox=b; saveMeta(); placeMemo(); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}

const COIN={o:10, t:5, x:2, rvo:15, grad:30};
const STICKERS=Array.from('🐶🐱🐰🦊🐻🐼🐨🐯🦁🐮🐷🐸🐵🐧🐤🦄🐝🦋🐢🐬🐳🦖🐙🦀🍓🍉🍩🍰🌈⭐🌙🌸🌻🍀🎈🎨🎵🚀👑💎');
const DEFAULT_REWARDS=[{id:'r1',name:'ゲーム・動画 15分',cost:100},{id:'r2',name:'好きなおやつ',cost:150},{id:'r3',name:'好きな本・まんが',cost:600}];
function coinTotals(){
  let earned=0;
  for(const l of state.learnAll.values()) for(const marks of Object.values(l.marks||{})){
    const best=new Map();
    for(const m of marks){ const k=dateKey(m.d); const v = m.m==='o' ? (m.rv?COIN.rvo:COIN.o) : m.m==='t' ? COIN.t : COIN.x; best.set(k, Math.max(best.get(k)||0, v)); }
    for(const v of best.values()) earned+=v;
    if(marks.length && srsOf(marks).st==='grad') earned+=COIN.grad;
  }
  for(const d of Object.values(state.stats.days||{})) earned += Math.min(6, Math.floor((d.sec||0)/600))*10;
  for(const l of state.learnAll.values()) for(const a of l.awards||[]) earned += a.c||0;   // 💮はなまるボーナス
  const spent=(state.rewards?.spent||[]).reduce((a,x)=>a+(x.cost||0),0);
  return {earned, spent, now:Math.max(0, earned-spent)};
}
function floatText(t,x,y){
  const d=document.createElement('div'); d.className='bigstamp'; d.style.cssText=`left:${x}px;top:${y}px;font-size:26px;color:#b8860b;font-weight:900`; d.textContent=t;
  document.body.appendChild(d);
  d.animate([{transform:'translate(-50%,-50%)',opacity:1},{transform:'translate(-50%,-180%)',opacity:0}],{duration:1200,easing:'ease-out'}).onfinish=()=>d.remove();
}
let lastCoins=null, lastEarned=null;
function updateCoins(x,y){
  const c=coinTotals();
  if(x!=null && lastCoins!=null && c.now>lastCoins) floatText(`+${c.now-lastCoins} 🪙`, x, y-40);
  if(lastEarned!=null && Math.floor(c.earned/100)>Math.floor(lastEarned/100)){
    const n=Math.floor(c.earned/100); setTimeout(()=>toast(`🎉 新しいシール ${STICKERS[(n-1)%STICKERS.length]} をゲット！`, 3500), 700);
  }
  lastCoins=c.now; lastEarned=c.earned;
  $('#coinNum').textContent=c.now; const lc=$('#libCoin'); if(lc) lc.textContent=c.now;
}

  const L=state.learner, r=state.rewards; r.updated=Date.now();

function mergeRewards(a,b){
  if(!a) return clone(b); if(!b) return a;
  const sp=new Map(); for(const x of [...(a.spent||[]),...(b.spent||[])]) sp.set(x.id,x);
  const newer=(b.updated||0)>(a.updated||0)?b:a;
  return {list:clone(newer.list||DEFAULT_REWARDS), spent:[...sp.values()].sort((x,y)=>x.d-y.d), updated:Math.max(a.updated||0,b.updated||0)};
}

async function onLiveMsg(m){
  if(m.t==='q'){ if(!sentQ.has(m.q?.id) && !(Cloud.mode==='cf' && !state.viewOnly && m.q?.L===state.learner && state.screen==='main')) showQBar(m.q); return; }

    return;
  }
  if(m.t==='memo'){
    if(state.book?.id===m.b && state.learner===m.L && (state.viewOnly ? m.from==='child' : m.from==='parent')){
      setMemo(m.open); if(m.open){ showMemoFor(m.p); if(!state.viewOnly) toast('📝 おうちの人がメモを開きました', 2200); }
    }
    return;
  }
  if(m.t==='curAll'){ state.liveCur={}; for(const c of m.cur||[]) state.liveCur[c.L]=c; const c=state.liveCur[state.learner]; if(state.viewOnly && c) await followTo(c); renderViewBar(); return; }
  if(m.t==='cur'){ (state.liveCur ||= {})[m.L]={...m, at:Date.now()}; if(state.viewOnly && m.L===state.learner) await followTo(m); renderViewBar(); return; }
  if(m.L && m.L!==state.learner) return;
  if(m.t==='liveEnd'){ clearViewLive(m.p); if((m.area==='memo'||m.area==='amemo') && state.memoOpen && memoPage===m.p) drawMemo(); return; }
  if(m.t==='live') armLiveClear(m.p);
  if(m.t==='adv'){ setAdvRec(m.b, m.p, m.rec, true); creditAwards(m.b); return; }
  if(m.t==='react'){ if(!state.viewOnly) showReaction(m.e, m.text); return; }
  if(m.t==='look'){ if(!state.viewOnly && state.book?.id===m.b) showPing(m.p, m.x, m.y); else if(!state.viewOnly) toast('👆 おうちの人が「ここ見て」と言っています', 2600); return; }
  if(m.t==='live' && m.area==='amemo'){ if(!state.viewOnly && state.book?.id===m.b && state.memoOpen && memoPage===m.p && m.item) drawAll(memoCv, memoItems().concat(state.adv.get(m.p)?.memo||[], [m.item])); return; }
  if(m.t==='liveEnd' && m.area==='amemo'){ if(!state.viewOnly && state.memoOpen && memoPage===m.p) drawMemo(); return; }
  if(m.t==='live' && m.area==='adv'){
    if(state.viewOnly || state.advHidden || state.book?.id!==m.b || !m.item) return;
    const pg=state.pages[m.p]; if(!pg?.rendered) return;
    const cv=viewLiveCanvas(pg), ctx=cv.getContext('2d'); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
    drawOnPage(ctx, [m.item], pg.g, pg.px); return;
  }
  if(!state.viewOnly) return;
  if(m.t==='page' && state.book?.id===m.b){
    const oldG=JSON.stringify(state.ink.get(m.p)?.gaps||[]);
    state.ink.set(m.p, m.rec); store.put('ink', inkKey(m.b,m.p), m.rec).catch(()=>{});
    if(JSON.stringify(m.rec.gaps||[])!==oldG) relayoutPage(m.p);
    const pg=state.pages[m.p]; if(pg?.rendered){ drawInk(pg); clearViewLive(m.p); }
    if(state.memoOpen && memoPage===m.p) drawMemo();
  } else if(m.t==='live' && state.book?.id===m.b && m.item){
    if(m.area==='memo'){ if(state.memoOpen && memoPage===m.p){ drawAll(memoCv, memoItems().concat([m.item])); } return; }
    const pg=state.pages[m.p]; if(!pg?.rendered) return;
    const cv=viewLiveCanvas(pg), ctx=cv.getContext('2d'); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
    drawOnPage(ctx, [m.item], pg.g, pg.px);
  } else if(m.t==='stats'){
    state.stats=m.stats; renderStats(); updateCoins();
  } else if(m.t==='learn'){
    state.learnAll.set(m.b, m.learn); store.put('learn', learnKey(m.b), m.learn).catch(()=>{});
    if(state.book?.id===m.b) state.pages.forEach(renderOverlay);
  } else if(m.t==='shared'){
    const old=JSON.stringify(state.sharedAll.get(m.b)?.rot||{});
    state.sharedAll.set(m.b, m.shared); store.put('shared', m.b, m.shared).catch(()=>{});
    if(state.book?.id===m.b){ state.shared=m.shared; if(JSON.stringify(m.shared.rot||{})!==old) relayout(); else state.pages.forEach(renderOverlay); }
  }
}

// 画像（端末に保存し、Cloudflare版ならクラウドにも置く）
const imgURLs=new Map();
async function imgURL(id){
  if(imgURLs.has(id)) return imgURLs.get(id);
  let buf=await store.get('files','img|'+id);
  if(!buf && Cloud.mode==='cf'){ try{ const r=await api('api/blob/'+id); if(r.ok){ buf=await r.arrayBuffer(); store.put('files','img|'+id, buf).catch(()=>{}); } }catch{} }
  if(!buf) return null;
  const u=URL.createObjectURL(new Blob([buf],{type:'image/jpeg'})); imgURLs.set(id,u); return u;
}
async function prepareImage(file){
  const bmp=await createImageBitmap(file);
  const k=Math.min(1, 1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',.85)); const buf=await blob.arrayBuffer();
  const id=await sha(buf);
  await store.put('files','img|'+id, buf);
  if(Cloud.mode==='cf') api('api/blob/'+id,{method:'PUT', headers:{'content-type':'image/jpeg'}, body:buf}).catch(()=>{});
  return {id, aspect:c.height/c.width};
}
function advHit(pg, e){
  const els=[...pg.ov.querySelectorAll('.advtx,.advimg')].reverse();
  for(const el of els){ const r=el.getBoundingClientRect(); if(e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom) return getAdv(pg.i).items.find(x=>x.id===el.dataset.id); }
  return null;
}
function advReplace(p, oldIt, newIt){
  const pg=state.pages[p];
  const swap=(a,b)=>{ const arr=getAdv(p).items; const j=arr.indexOf(a); if(b){ if(j>=0) arr[j]=b; else arr.push(b); } else if(j>=0) arr.splice(j,1); saveAdv(p); if(pg){ drawInk(pg); renderOverlay(pg); } };
  if(!oldIt){ getAdv(p).items.push(newIt); saveAdv(p); if(pg) renderOverlay(pg); pushUndo({undo:()=>swap(newIt,null), redo:()=>{ getAdv(p).items.push(newIt); saveAdv(p); if(pg) renderOverlay(pg); }}); return; }
  swap(oldIt,newIt); pushUndo({undo:()=>{ if(newIt) swap(newIt,oldIt); else { getAdv(p).items.push(oldIt); saveAdv(p); if(pg) renderOverlay(pg); } }, redo:()=>swap(oldIt,newIt)});

/* ================= 🎬 解説の録画（ホワイトボード：線・マーカー・文字・スタンプ・画像＋声）と再生 =================
   イベントに時刻 t（ミリ秒）をつけて記録し、再生では時刻までの状態を作り直して描く。
   s=線（it に線の中身、t〜te で書いた） / img=画像 / tx=文字 / st=スタンプ / er=消す / mv=動かす・大きさ / grp=まとめて / undo・redo */
const LEC={mode:null, a:0.75, bg:null, ev:[], t0:0, rec:null, chunks:[], stream:null, mime:'', audioBlob:null, dur:0, timer:null, target:null, play:null,
  tool:'pen', pen:'#1d2330', mk:'#ffe14d', penW:1, mkW:1, imgs:new Map(), tbox:new Map(), items:[], sel:null, preview:null, vz:1, vx:0, vy:0, W:300, H:225, prep:[]};
const LEC_PEN=['#1d2330','#e11d48','#1f5fd6','#0a9b5c','#ff5a00','#7c3aed'], LEC_MK=['#ffe14d','#7dd3fc','#86efac','#ff8fc2','#ffb35c'];
function lecNow(){ return LEC.t0 ? Math.round(performance.now()-LEC.t0) : 0; }
function lecSize(){
  const wrap=$('#lecWrap'); const W0=wrap.clientWidth-16, H0=wrap.clientHeight-16;
  const W=Math.max(200, Math.min(W0, H0/LEC.a)), H=W*LEC.a; LEC.W=W; LEC.H=H;
  const st=$('#lecStage'); st.style.width=W+'px'; st.style.height=H+'px';
  lecRes(); lecView();
}
function lecRes(){
  const cv=$('#lecCv'), W=LEC.W, H=LEC.H;
  const r=Math.min(pixelRatioFor(W,H)*Math.min(LEC.vz,3), Math.sqrt(14e6/(W*H)));
  cv.width=Math.floor(W*r); cv.height=Math.floor(H*r); cv.style.width=W+'px'; cv.style.height=H+'px';
}
function lecView(){
  const st=$('#lecStage'), wrap=$('#lecWrap');
  if(LEC.vz<=1.001){ LEC.vz=1; LEC.vx=0; LEC.vy=0; }
  else { const mx=LEC.W*LEC.vz*.85, my=LEC.H*LEC.vz*.85; LEC.vx=Math.max(-mx, Math.min(wrap.clientWidth*.6, LEC.vx)); LEC.vy=Math.max(-my, Math.min(wrap.clientHeight*.6, LEC.vy)); }
  st.style.transformOrigin='0 0'; st.style.transform=`translate(${LEC.vx}px,${LEC.vy}px) scale(${LEC.vz})`;
  const s=$('#lecSel'); if(s) s.querySelector('.lsbar').style.transform=`scale(${1/LEC.vz})`;
}
// 時刻 T までの状態
function lecApply(m, e){
  if(e.k==='s'||e.k==='img'||e.k==='tx'||e.k==='st'){ if(!e.id) e.id='o'+Math.random().toString(36).slice(2,9); m.set(e.id, e); }
  else if(e.k==='er'){ for(const id of e.ids) m.delete(id); }
  else if(e.k==='clear'){ m.clear(); }
  else if(e.k==='mv'){ for(const id of e.ids){ const it=m.get(id); if(it) m.set(id, lecXf(it, e)); } }
  else if(e.k==='grp'){ for(const x of e.evs) lecApply(m, x); }
}
function lecItemsAt(T=Infinity){
  const done=[], undone=[];
  for(const e of LEC.ev){ if(e.t>T) break;
    if(e.k==='undo'){ if(done.length) undone.push(done.pop()); }
    else if(e.k==='redo'){ if(undone.length) done.push(undone.pop()); }
    else { done.push(e); undone.length=0; }
  }
  const m=new Map(); for(const e of done) lecApply(m, e); return [...m.values()];
}
function lecXf(it, e){
  const f=(x,y)=>[e.cx+(x-e.cx)*e.sc+e.dx, e.cy+(y-e.cy)*e.sc+e.dy];
  if(it.k==='s'){
    const src=it.v2 ? it.it : it; const p=src.p.slice();
    for(let i=0;i<p.length;i+=3){ const q=f(p[i],p[i+1]); p[i]=rnd(q[0]); p[i+1]=rnd(q[1]); }
    const ni={...src, p, w:src.w*e.sc}; return it.v2 ? {...it, it:ni} : {...it, ...ni};
  }
  const q=f(it.x,it.y);
  if(it.k==='img') return {...it, x:q[0], y:q[1], w:it.w*e.sc, h:it.h*e.sc};
  if(it.k==='st') return {...it, x:q[0], y:q[1], s:it.s*e.sc};
  return {...it, x:q[0], y:q[1], fs:it.fs*e.sc, w:(it.w||4000)*e.sc};
}
function lecStrokeOf(it, T){
  if(it.v2){ let p=it.it.p; if(T!==Infinity && it.te>T){ const f=(T-it.t)/Math.max(1,it.te-it.t); p=p.slice(0, Math.max(1,Math.floor(p.length/3*f))*3); } return {...it.it, p}; }

}
function lecDrawText(ctx, it, s){
  const fs=it.fs*s; ctx.save(); ctx.font=`700 ${fs}px "Hiragino Sans","Noto Sans JP",sans-serif`; ctx.fillStyle=it.c||'#1d2330'; ctx.textBaseline='top';

  let y=it.y*s, mw=0; for(const l of lines){ ctx.fillText(l, it.x*s, y); mw=Math.max(mw, ctx.measureText(l).width); y+=fs*1.35; }
  LEC.tbox.set(it.id, {x:it.x, y:it.y, w:Math.max(mw/s, it.fs), h:lines.length*it.fs*1.35}); ctx.restore();
}
function lecDrawItems(ctx, items, s, T=Infinity){
  for(const it of items){
    if(it.k==='img'){ const im=LEC.imgs.get(it.src)?.el; if(im && im.complete && im.naturalWidth) ctx.drawImage(im, it.x*s, it.y*s, it.w*s, it.h*s); else { ctx.fillStyle='#eef1f5'; ctx.fillRect(it.x*s, it.y*s, it.w*s, it.h*s); } }
    else if(it.k==='tx') lecDrawText(ctx, it, s);
    else if(it.k==='st') drawSticker(ctx, it, s);

  }
}
function lecPaint(T=Infinity){
  const cv=$('#lecCv'), ctx=cv.getContext('2d'); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  let items=LEC.items; const pv=LEC.preview;

  lecDrawItems(ctx, items, cv.width/10000, T);
  if(LEC.mode==='rec') lecRenderSel();
}
function lecDraw(T=Infinity){ LEC.items=lecItemsAt(T); lecPaint(T); }
function lecPush(e){ LEC.ev.push(e); lecDraw(); if(LEC.sel){ const have=new Set(LEC.items.map(i=>i.id)); LEC.sel.ids=LEC.sel.ids.filter(id=>have.has(id)); if(!LEC.sel.ids.length) LEC.sel=null; lecRenderSel(); } }
// 位置と大きさ（えらぶ・動かす用）
function lecBox(it){
  if(it.k==='img') return {x:it.x, y:it.y, w:it.w, h:it.h};
  if(it.k==='st'){ const w=it.tx?it.s*1.6:it.s*.6, h=it.s*.5; return {x:it.x-w, y:it.y-h, w:w*2, h:h*2}; }
  if(it.k==='tx') return LEC.tbox.get(it.id) || {x:it.x, y:it.y, w:it.w||4000, h:it.fs*1.4};
  const st=lecStrokeOf(it, Infinity), p=st.p; let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(let i=0;i<p.length;i+=3){ x0=Math.min(x0,p[i]); x1=Math.max(x1,p[i]); y0=Math.min(y0,p[i+1]); y1=Math.max(y1,p[i+1]); }
  const r=(st.w||30)/2; return {x:x0-r, y:y0-r, w:x1-x0+2*r, h:y1-y0+2*r};

const inPoly=(x,y,poly)=>{ let c=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const [xi,yi]=poly[i],[xj,yj]=poly[j]; if(((yi>y)!==(yj>y)) && x<(xj-xi)*(y-yi)/(yj-yi)+xi) c=!c; } return c; };

function lecLasso(poly){
  const ids=[];

    if(it.k==='s'){ const p=lecStrokeOf(it,Infinity).p; let n=0,t=0; for(let i=0;i<p.length;i+=3){ t++; if(inPoly(p[i],p[i+1],poly)) n++; } if(t && n>=t/2) ids.push(it.id); }
    else { const b=lecBox(it); if(inPoly(b.x+b.w/2, b.y+b.h/2, poly)) ids.push(it.id); }

function lecPlay(d, audioUrl, bgUrl, preview){
  if(LEC.play){ LEC.play.audio?.pause(); cancelAnimationFrame(LEC.play.raf); }
  const keepRec = preview ? {mode:LEC.mode, ev:LEC.ev, a:LEC.a, bg:LEC.bg} : null;

  lecSize();

  const P=LEC.play={audio, raf:0, rate:1, title:d.title, t:0, clock:null, keepRec};
  lecTools();
  $('#lecCtl').innerHTML=`<button class="ib" data-p="back">⏪10</button><button class="recbtn play" data-p="pp">▶</button>
    <input type="range" id="lecSeek" min="0" max="${Math.max(1,dur)}" step="0.1" value="0" style="flex:1;min-width:120px">
    <span id="lecT" style="font-weight:800;min-width:96px">0:00 / ${fmtSec(dur)}</span><button class="pill" data-p="rate">1倍</button>
    ${preview?'<button class="btn" data-p="backrec">録画にもどる</button>':''}`;
  const now=()=> audio ? audio.currentTime : (P.clock ? (performance.now()-P.clock)/1000*P.rate + P.t : P.t);
  const tick=()=>{ const t=now(); P.lastT=t*1000; lecDraw(t*1000); const s=$('#lecSeek'); if(s && document.activeElement!==s) s.value=t; const tt=$('#lecT'); if(tt) tt.textContent=`${fmtSec(Math.min(t,dur))} / ${fmtSec(dur)}`;
    if(t>=dur && !audio){ P.t=dur; P.clock=null; setPP(false); return; } P.raf=requestAnimationFrame(tick); };
  const setPP=on=>{ const b=$('#lecCtl [data-p=pp]'); if(b){ b.textContent=on?'❚❚':'▶'; } };
  const play=async()=>{ if(audio){ try{ await audio.play(); }catch{ toast('音声を再生できませんでした'); } } else { P.clock=performance.now(); } setPP(true); cancelAnimationFrame(P.raf); tick(); };
  const pause=()=>{ if(audio) audio.pause(); else { P.t=now(); P.clock=null; } setPP(false); };
  if(audio){ audio.onended=()=>setPP(false); }
  $('#lecCtl').onclick=e=>{
    const b=e.target.closest('button'); if(!b) return; const a=b.dataset.p;
    if(a==='pp'){ const playingNow = audio ? !audio.paused : !!P.clock; playingNow ? pause() : play(); }
    else if(a==='back'){ if(audio) audio.currentTime=Math.max(0,audio.currentTime-10); else P.t=Math.max(0,now()-10), P.clock=P.clock&&performance.now(); lecDraw(now()*1000); }
    else if(a==='rate'){ P.rate = P.rate===1?1.5:P.rate===1.5?2:1; if(audio) audio.playbackRate=P.rate; b.textContent=P.rate+'倍'; }
    else if(a==='backrec'){ pause(); cancelAnimationFrame(P.raf); const k=P.keepRec; LEC.play=null; LEC.mode=k.mode; LEC.ev=k.ev; LEC.a=k.a; LEC.vz=1; if(k.bg) $('#lecBg').src=k.bg; else $('#lecBg').removeAttribute('src'); lecSize(); lecDraw(); lecTools(); $('#lecCtl').onclick=null; }
  };
  $('#lecSeek').oninput=e=>{ const t=+e.target.value; if(audio) audio.currentTime=t; else { P.t=t; if(P.clock) P.clock=performance.now(); } lecDraw(t*1000); };
  lecDraw(0); play();
}

const VID_MAX = 60*1024*1024, PART = 1024*1024;
const vidURLs=new Map();
function progressSheet(title){

function videoMeta(file){
  return new Promise(res=>{ const v=document.createElement('video'); v.preload='metadata'; v.muted=true; v.playsInline=true;
    const u=URL.createObjectURL(file); const done=d=>{ URL.revokeObjectURL(u); res(d); };
    v.onloadedmetadata=()=>done({dur:isFinite(v.duration)?v.duration:0, w:v.videoWidth, h:v.videoHeight}); v.onerror=()=>done({dur:0}); setTimeout(()=>done({dur:0}), 8000); v.src=u; });
}
async function advVideoAt(pg, pt){

$('#advVidFile').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; const at=state.pendingVidAt; state.pendingVidAt=null; if(!f || !at) return;
  if(Cloud.mode!=='cf'){ toast('動画は、Cloudflare版で送れます'); return; }
  if(f.size > VID_MAX){
    await openSheet(`<h3>🎥 動画が大きすぎます</h3><p>この動画は <b>${(f.size/1048576).toFixed(0)}MB</b> です。送れるのは <b>60MBまで</b>（画面収録で1〜2分くらい）です。</p>
      <p class="note">iPhoneの「写真」アプリで動画を開き、「編集」で前後を切ると小さくできます。短く分けて送るのもおすすめです。</p><button class="btn" style="width:100%" data-a="1">OK</button>`,
      close=>$('#sheet [data-a]').onclick=()=>close());
    return;
  }
  const ui=progressSheet('🎥 動画を送っています');
  try{
    const meta=await videoMeta(f); ui.set(0,'準備しています…');
    const buf=await f.arrayBuffer(); if(ui.canceled) return;
    const id=await sha(buf); const mime=f.type||'video/mp4'; const parts=Math.ceil(buf.byteLength/PART);
    if(!(await Cloud.hasPdf(id))){
      for(let i=0;i<parts;i++){
        if(ui.canceled){ toast('送るのをやめました'); return; }
        const body=buf.slice(i*PART, Math.min(buf.byteLength,(i+1)*PART)); let ok=false;
        for(let tr=0; tr<3 && !ok; tr++){ try{ const r=await api(`api/blob/${id}/part/${i}`,{method:'PUT', body}); ok=r.ok; }catch{} if(!ok) await new Promise(r=>setTimeout(r,800*(tr+1))); }
        if(!ok) throw new Error('part');
        ui.set((i+1)/parts, `${Math.round((i+1)/parts*100)}%（${((i+1)*PART/1048576).toFixed(0)} / ${(buf.byteLength/1048576).toFixed(0)}MB）`);
      }
      const r=await api(`api/blob/${id}/done?parts=${parts}&size=${buf.byteLength}&name=${encodeURIComponent(mime)}`,{method:'POST'});
      if(!r.ok) throw new Error('done');
    }
    store.put('files','vid|'+id, buf).catch(()=>{});
    ui.close();
    advReplace(at.p, null, {k:'vid', id:uid('a'), vid:id, mime, size:buf.byteLength, dur:Math.round(meta.dur||0), x:rnd(at.pt.x), y:rnd(at.pt.y)});
    toast('🎥 動画を送りました', 2000);
  }catch(err){ console.warn(err); ui.close(); toast('動画を送れませんでした。電波のよい所で、もう一度ためしてください', 5000); }
};
async function vidURL(it, onProgress){
  if(vidURLs.has(it.vid)) return vidURLs.get(it.vid);
  let buf=await store.get('files','vid|'+it.vid);
  if(!buf && Cloud.mode==='cf'){
    const r=await api('api/blob/'+it.vid); if(!r.ok) return null;
    const total=+(r.headers.get('content-length')||it.size||0); const rd=r.body.getReader(); const parts=[]; let got=0;
    for(;;){ const {done, value}=await rd.read(); if(done) break; parts.push(value); got+=value.length; onProgress?.(total?got/total:0, got); }
    const out=new Uint8Array(got); let o=0; for(const p of parts){ out.set(p,o); o+=p.length; } buf=out.buffer;
    store.put('files','vid|'+it.vid, buf).catch(()=>{});
  }
  if(!buf) return null;
  const u=URL.createObjectURL(new Blob([buf],{type:it.mime||'video/mp4'})); vidURLs.set(it.vid,u); return u;
}

// ペンを最後に0.6秒止めると、直線か、まる（だ円）に整える
function snapShape(item){
  const p=item.p; if(p.length<9) return false;
  const xs=[], ys=[]; for(let i=0;i<p.length;i+=3){ xs.push(p[i]); ys.push(p[i+1]); }
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  let len=0; for(let i=1;i<xs.length;i++) len+=Math.hypot(xs[i]-xs[i-1], ys[i]-ys[i-1]);
  const gapEnd=Math.hypot(xs[0]-xs[xs.length-1], ys[0]-ys[ys.length-1]);
  const w=x1-x0, h=y1-y0;
  if(len>0 && gapEnd < len*.18 && Math.min(w,h) > Math.max(w,h)*.25){
    const cx=(x0+x1)/2, cy=(y0+y1)/2, rx=w/2, ry=h/2, n=64, out=[];
    for(let i=0;i<=n;i++){ const a=i/n*Math.PI*2; out.push(rnd(cx+rx*Math.cos(a)), rnd(cy+ry*Math.sin(a)), 50); }
    item.p=out; return 'まる';
  }
  item.p=[p[0],p[1],50, p[p.length-3],p[p.length-2],50]; return 'まっすぐ';
}
// 投げ縄
const pip=(poly,x,y)=>{ let c=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const [xi,yi]=poly[i],[xj,yj]=poly[j]; if(((yi>y)!==(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c; } return c; };
function itemBox(it){
  if(it.k==='s'){ const b=bbox(it); return {x0:b.x0-it.w/2, y0:b.y0-it.w/2, x1:b.x1+it.w/2, y1:b.y1+it.w/2}; }
  const r = it.k==='tx' ? null : (it.s||600)*(it.tx?1.6:.6);
  if(it.k==='tx') return {x0:it.x, y0:it.y, x1:it.x+it.w, y1:it.y+it.fs*2.4};
  return {x0:it.x-r, y0:it.y-r, x1:it.x+r, y1:it.y+r};
}
function moveIt(it,dx,dy){ if(it.k==='s'){ for(let i=0;i<it.p.length;i+=3){ it.p[i]+=dx; it.p[i+1]+=dy; } bboxCache.delete(it); } else { it.x+=dx; it.y+=dy; } }
function scaleIt(it,ox,oy,f){
  if(it.k==='s'){ for(let i=0;i<it.p.length;i+=3){ it.p[i]=rnd(ox+(it.p[i]-ox)*f); it.p[i+1]=rnd(oy+(it.p[i+1]-oy)*f); } it.w=Math.max(6,rnd(it.w*f)); bboxCache.delete(it); }
  else { it.x=rnd(ox+(it.x-ox)*f); it.y=rnd(oy+(it.y-oy)*f); if(it.s) it.s=rnd(it.s*f); if(it.fs){ it.fs=rnd(it.fs*f); it.w=rnd(it.w*f); } }
}
let SEL=null;   // {p, items, box}
function selBoxOf(items){ let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity; for(const it of items){ const b=itemBox(it); x0=Math.min(x0,b.x0); y0=Math.min(y0,b.y0); x1=Math.max(x1,b.x1); y1=Math.max(y1,b.y1); } return {x:x0, y:y0, w:x1-x0, h:y1-y0}; }

function lassoSelect(pg, poly){
  const p=pg.i, inside=it=>{
    if(it.k==='m') return false;            // ⭕❌は丸つけの記録とつながっているので動かさない
    if(it.k==='s'){ let n=0,t=0; for(let i=0;i<it.p.length;i+=3){ t++; if(pip(poly,it.p[i],it.p[i+1])) n++; } return n>=t*.6; }

}
function renderSel(pg){
  if(!SEL || SEL.p!==pg.i) return;
  const box=selBoxOf(SEL.items), r=rectMap(toD,pg.g,box);
  const d=document.createElement('div'); d.className='selBox'; setRect(d, {x:r.x-60,y:r.y-60,w:r.w+120,h:r.h+120});
  d.innerHTML=`<div class="selBar"><button data-s="dup">⧉ 複製</button><button data-s="del">🗑 消す</button><button data-s="ok">✓</button></div><div class="selH"></div>`;
  pg.ov.appendChild(d);
  const k=()=>pg.g.Dw/pg.w;
  const dB=(dx,dy)=>{ const a=toB(pg.g,0,0), b=toB(pg.g,dx*k(),dy*k()); return [b.x-a.x, b.y-a.y]; };
  const snap=()=>clone(getInk(pg.i).items);
  let drag=null;
  const start=(e,mode)=>{ e.stopPropagation(); e.preventDefault(); try{ e.target.setPointerCapture(e.pointerId); }catch{} drag={mode, x:e.clientX, y:e.clientY, before:snap(), box, f:1}; };

  d.addEventListener('pointermove', e=>{
    if(!drag) return; e.preventDefault();
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
    if(drag.mode==='move'){ const [bx,by]=dB(dx,dy); for(const it of SEL.items) moveIt(it,bx,by); }
    else { const bw=Math.max(200, drag.box.w); const [bx]=dB(dx,dy); const f=Math.max(.2, (bw*drag.f+bx)/(bw*drag.f)); drag.f*=f; for(const it of SEL.items) scaleIt(it, drag.box.x, drag.box.y, f); }

  });
  const end=e=>{ if(!drag) return; const before=drag.before; drag=null; saveInk(pg.i); const after=snap();
    pushUndo({undo:()=>{ getInk(pg.i).items=clone(before); clearSel(); drawInk(pg); saveInk(pg.i); }, redo:()=>{ getInk(pg.i).items=clone(after); clearSel(); drawInk(pg); saveInk(pg.i); }});
    renderOverlay(pg); };

  d.querySelector('.selBar').addEventListener('pointerdown', e=>e.stopPropagation());
  d.querySelector('.selBar').onclick=e=>{
    const a=e.target.closest('button')?.dataset.s; if(!a) return;
    const before=snap(), p=pg.i;
    if(a==='ok'){ clearSel(); return; }
    if(a==='del'){ const set=new Set(SEL.items); getInk(p).items=getInk(p).items.filter(it=>!set.has(it)); SEL=null; }
    if(a==='dup'){ const copies=SEL.items.map(it=>{ const c=clone(it); if(c.id) c.id=uid('d'); moveIt(c,300,300); return c; }); getInk(p).items.push(...copies); SEL.items=copies; }
    const after=snap(); drawInk(pg); saveInk(p); renderOverlay(pg);
    pushUndo({undo:()=>{ getInk(p).items=clone(before); clearSel(); drawInk(pg); saveInk(p); }, redo:()=>{ getInk(p).items=clone(after); clearSel(); drawInk(pg); saveInk(p); }});
  };
}

/* ================= 🔍 問題の自動検出（PDFの文字情報から） ================= */
const toHalf = s => s.replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
const MARKERS = [
  /^(第\s*[0-9０-９]+\s*問|問題?\s*[0-9０-９]+)/,
  /^[\[［【〔]\s*[0-9０-９]{1,2}\s*[\]］】〕]/,
  /^[（(]\s*[0-9０-９]{1,2}\s*[)）]/,
  /^[①-⑳]/,
  /^[0-9０-９]{1,2}\s*[.．]\s*\S/
];
async function detectProblemsOn(pdf, pi){
  const page=await pdf.getPage(pi+1); const vp=page.getViewport({scale:1}); const k=10000/vp.width, H=10000*vp.height/vp.width;
  const tc=await page.getTextContent(); const its=[];
  for(const it of tc.items){
    if(!it.str || !it.str.trim()) continue;
    const [a,b,c,d,e,f]=it.transform; const la=Math.hypot(a,b)||1, fh=Math.hypot(c,d)||1;
    const p1=vp.convertToViewportPoint(e,f), p2=vp.convertToViewportPoint(e+a/la*(it.width||0), f+b/la*(it.width||0)), p3=vp.convertToViewportPoint(e+c/fh*fh, f+d/fh*fh);
    const xs=[p1[0],p2[0],p3[0]], ys=[p1[1],p2[1],p3[1]];
    const x=Math.min(...xs)*k, y=Math.min(...ys)*k, w=(Math.max(...xs)-Math.min(...xs))*k, h=Math.max(8,(Math.max(...ys)-Math.min(...ys))*k);
    its.push({s:it.str, x, y, w, h, horiz: Math.abs(p2[0]-p1[0]) >= Math.abs(p2[1]-p1[1])});
  }
  if(its.length<3) return {none:true};
  if(its.filter(i=>i.y<H*.15).some(i=>/^\s*(解答|答え|こたえ|解説)/.test(i.s))) return {regions:[], answers:true};
  // 行にまとめる
  its.sort((p,q)=>(p.y+p.h/2)-(q.y+q.h/2)); const lines=[];
  for(const it of its){
    const cy=it.y+it.h/2;
    const ln=lines.find(l=>Math.abs(l.cy-cy)<Math.min(l.h,it.h)*.6 && it.x>=l.x-200 ? (it.x < l.x ? l.x-(it.x+it.w) < 400 : it.x-(l.x+l.w) < 400) : false);
    if(ln){ ln.items.push(it); const x2=Math.max(ln.x+ln.w,it.x+it.w); ln.x=Math.min(ln.x,it.x); ln.w=x2-ln.x; const y2=Math.max(ln.y+ln.h,it.y+it.h); ln.y=Math.min(ln.y,it.y); ln.h=y2-ln.y; ln.cy=ln.y+ln.h/2; }
    else lines.push({items:[it], x:it.x, y:it.y, w:it.w, h:it.h, cy});
  }
  for(const l of lines){ l.items.sort((p,q)=>p.x-q.x); l.text=l.items.map(i=>i.s).join('').trim(); }
  // ページ番号などの下の飾りを外す
  const body=lines.filter(l=>!(l.y>H*.92 && l.text.length<=8) && !(l.y+l.h<H*.04 && l.text.length<=8));
  if(!body.length) return {none:true};
  const cL=Math.min(...body.map(l=>l.x)), cR=Math.max(10000-cL, ...body.map(l=>l.x+l.w)), cB=Math.max(...body.map(l=>l.y+l.h)), cW=cR-cL;
  let level=-1, marks=[];
  for(let i=0;i<MARKERS.length;i++){
    const m=body.filter(l=>MARKERS[i].test(l.text)).map(l=>({l, label:toHalf(l.text.match(MARKERS[i])[0]).replace(/\s/g,'')}));
    if(m.length>=(i===0?1:2)){ level=i; marks=m; break; }
  }
  if(level<0) return {regions:[]};
  // 段組み（左右2列など）を見分ける
  const xsorted=[...marks].sort((p,q)=>p.l.x-q.l.x); const cols=[[xsorted[0]]];
  for(const m of xsorted.slice(1)){ const c=cols[cols.length-1]; if(m.l.x - c[0].l.x > cW*.3) cols.push([m]); else c.push(m); }
  const pad=120, out=[];
  cols.forEach((col,ci)=>{
    const left=Math.min(...col.map(m=>m.l.x)); const right = ci<cols.length-1 ? Math.min(...cols[ci+1].map(m=>m.l.x))-pad*2 : cR;
    const ms=col.filter(m=>m.l.x <= left + cW*.08).sort((p,q)=>p.l.y-q.l.y);
    ms.forEach((m,i)=>{
      const top=m.l.y-pad;
      let bot;
      if(i<ms.length-1) bot=ms[i+1].l.y-pad*1.5;
      else { const below=body.filter(l=>l.y>m.l.y && l.x>=left-pad && l.x<right); bot=Math.max(m.l.y+m.l.h*4, ...below.map(l=>l.y+l.h)) + pad; bot=Math.max(bot, Math.min(H*.93, cB+pad*6)); }
      const x=Math.max(0,left-pad), y=Math.max(0,top), w=Math.min(10000,right+pad)-x, h=Math.min(H,bot)-y;
      if(w>500 && h>250) out.push({x:Math.round(x), y:Math.round(y), w:Math.round(w), h:Math.round(h), label:m.label});
    });
  });
  return {regions:out};
}
async function autoDetect(){
  if(!state.book || !state.pdf) return;
  const sh=state.shared, b=state.book.id;
  const scope=await openSheet(`<h3>🔍 問題を自動で見つける</h3><p class="note" style="margin-bottom:12px">PDFの文字（問1、(2)、①、［3］など）から1問ずつのわくを作ります。すでにわくがあるページはそのままです。</p>
    <div class="grid2"><button class="btn sub" data-a="page" style="height:56px">このページ</button><button class="btn" data-a="all" style="height:56px">全ページ</button></div>`,
    close=>$('#sheet').querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>close(x.dataset.a)));
  if(!scope) return;
  const pages = scope==='page' ? [state.curPage] : [...Array(state.book.pages).keys()];
  const added=[]; let skipped=0, noText=0; let n=Math.max(0,...sh.problems.map(q=>q.n||0));
  toast('さがしています…', 20000);
  for(const p of pages){
    if(sh.problems.some(q=>q.p===p)){ skipped++; continue; }
    let r; try{ r=await detectProblemsOn(state.pdf, p); }catch(e){ console.warn(e); continue; }
    if(r.none){ noText++; continue; }
    for(const g of r.regions) added.push({id:uid('q'), p, x:g.x, y:g.y, w:g.w, h:g.h, n:++n, label:g.label});
  }
  const redraw=()=>{ for(const pg of state.pages) if(pg.rendered) renderOverlay(pg); };
  if(!added.length){
    toast(noText===pages.length ? '文字の情報がないPDF（スキャン）のようです。🔲 問題わくで囲んでください' : skipped===pages.length ? 'すでに問題わくがあります' : '見つかりませんでした。🔲 問題わくで囲んでください', 4500); return;
  }
  const redo=()=>{ sh.problems.push(...added); saveShared(b); redraw(); };
  const undo=()=>{ sh.problems=sh.problems.filter(q=>!added.includes(q)); saveShared(b); redraw(); refreshDue(); };
  redo(); pushUndo({undo,redo});
  toast(`🔍 ${added.length}問 みつけました${skipped?`（わくのある${skipped}ページはそのまま）`:''}。ちがうわくは🔲で消せます。↶で全部もどせます`, 5000);
}

/* ================= ↕️ すきま（おうちの人から）：操作を子どもの端末に送って、子どもの書きこみと同じようにずらす ================= */
function gapOpApply(p, op, doInk, doAdv){
  const rec=getInk(p); rec.gaps=(rec.gaps||[]).slice().sort((a,b)=>a.y-b.y);
  const lists=[]; if(doInk) lists.push(rec.items); if(doAdv) lists.push(getAdv(p).items);
  if(op.k==='add'){ for(const L of lists) for(const it of L) if(itemMinY(it)>=op.yE) shiftItem(it, op.h); rec.gaps.push({y:op.yB, h:op.h}); }
  else {
    let off=0, g=null; for(const q of rec.gaps){ if(q.y===op.y){ g=q; break; } off+=q.h; }
    if(!g) return false; const top=g.y+off, bottom=top+g.h;
    if(op.k==='size'){ for(const L of lists) for(const it of L) if(itemMinY(it)>=bottom) shiftItem(it, op.dh); g.h+=op.dh; }
    else if(op.k==='del'){
      for(const L of lists) for(let i=L.length-1;i>=0;i--){ const y=itemMinY(L[i]); if(y>=top && y<bottom) L.splice(i,1); else if(y>=bottom) shiftItem(L[i], -g.h); }
      rec.gaps=rec.gaps.filter(q=>q!==g);
    }
  }
  rec.gaps.sort((a,b)=>a.y-b.y); return true;
}
function parentGapSend(p, op){
  const b=state.book.id, L=state.learner;
  if(!gapOpApply(p, op, true, true)) return;
  saveAdv(p); relayoutPage(p);
  Live.send({t:'gapOp', L, b, p, op});
  const r=getInk(p); r.updated=Date.now(); store.put('ink', inkKey(b,p,L), r).catch(()=>{});
  Cloud.put(`ln_${L}_${b}/ink/p${p}`, {kind:'ink', updated:r.updated, items:r.items, memo:r.memo||[], gaps:r.gaps||[]});
}
async function parentGapAt(pg, pt){
  const p=pg.i; if(pageRot(p)){ toast('回転したページには、すきまを入れられません'); return; }
  const gaps=pageGaps(p); let off=0, hit=null;
  for(const q of gaps){ const s=q.y+off; if(pt.y>=s && pt.y<s+q.h){ hit=q; break; } off+=q.h; }
  if(hit){
    const r=await openSheet(`<h3>↕️ すきま</h3><div class="grid2" style="margin-bottom:10px"><button class="btn sub" data-a="more">もっと広く</button><button class="btn sub" data-a="less">せまく</button></div>
      <div class="grid2"><button class="btn red" data-a="del">すきまを消す</button><button class="btn" data-a="0">とじる</button></div>`,
      close=>$('#sheet').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>close(b.dataset.a)));
    if(!r || r==='0') return;
    if(r==='del'){ if(!(await confirmDlg('すきまを消す','このすきまに書いたもの（子どもの書きこみも）が消えます。','消す',true))) return; parentGapSend(p, {k:'del', y:hit.y}); return; }
    const dh = r==='more' ? Math.round(hit.h*.5) : -Math.min(hit.h-800, Math.round(hit.h/3)); if(!dh) return;
    parentGapSend(p, {k:'size', y:hit.y, dh});
    pushUndo({undo:()=>parentGapSend(p, {k:'size', y:hit.y, dh:-dh}), redo:()=>parentGapSend(p, {k:'size', y:hit.y, dh})});
    return;
  }
  const yB=e2b(pg.g, pt.y); if(yB==null) return;
  const op={k:'add', yB:Math.round(yB), yE:Math.round(pt.y), h:2600};
  parentGapSend(p, op);
  pushUndo({undo:()=>parentGapSend(p, {k:'del', y:op.yB}), redo:()=>parentGapSend(p, op)});
  toast('↕️ すきまを入れました（子どもの画面にも入ります）', 2600);
}
